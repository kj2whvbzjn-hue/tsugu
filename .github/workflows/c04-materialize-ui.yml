name: TSUGU C-04 Materialize UI Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/c04-materialize-ui.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.head_ref == 'vnext-c04-ui-usability-20260912' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Tune C-04 bounded item UI
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode static/app.js.gz.b64 | gzip --decompress > /tmp/app.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/app.js')
          s=p.read_text()
          if s.count('const pageSize=10') != 1:
              raise SystemExit('expected current pageSize=10 exactly once')
          s=s.replace('const pageSize=10','const pageSize=8',1)
          s=s.replace('検索・絞り込み・10件単位の表示で直接対象へ移動します。','検索・絞り込み・8件単位の表示で直接対象へ移動します。',1)
          p.write_text(s)
          PY
          node --check /tmp/app.js
          grep -q "cache:'no-store'" /tmp/app.js
          grep -q 'const pageSize=8' /tmp/app.js
          gzip -n -c /tmp/app.js | base64 -w0 > static/app.js.gz.b64

          if ! grep -q '.item-tools input,.item-tools select{min-height:44px}' static/styles.css; then
            cat >> static/styles.css <<'CSS'
          .item-tools input,.item-tools select{min-height:44px}
          CSS
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js.gz.b64 static/styles.css
          git diff --cached --check
          git commit -m 'C-04: reduce item page to eight rows'
          git push origin HEAD:${{ github.head_ref }}
