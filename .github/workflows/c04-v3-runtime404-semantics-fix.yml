name: C04 v3 align expected mutation 404 semantics

on:
  push:
    branches:
      - c04-v3-decision-ui-implementation-20260912
    paths:
      - '.github/workflows/c04-v3-runtime404-semantics-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Align v3 runtime accounting with frozen unexpected-error criterion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/c04-ui-usability-v3.e2e.cjs')
          s=p.read_text()
          old="let expected404=true,trackNav=false;page.on('pageerror',e=>evidence.runtime.pageErrors.push(e.message));page.on('console',m=>{if(m.type()!=='error')return;const t=m.text();if(expected404&&t.includes('404'))return;evidence.runtime.consoleErrors.push(t)});page.on('response',r=>{if(!r.url().startsWith('https://api.github.com/')||r.status()<400)return;if(expected404&&r.status()===404)return;evidence.runtime.apiErrors.push({url:r.url(),status:r.status()})});"
          new="let expectedWorkspace404=true,expectedMutation404=false,trackNav=false;page.on('pageerror',e=>evidence.runtime.pageErrors.push(e.message));page.on('console',m=>{if(m.type()!=='error')return;const t=m.text();if(t.includes('404')&&(expectedWorkspace404||expectedMutation404))return;evidence.runtime.consoleErrors.push(t)});page.on('response',r=>{if(!r.url().startsWith('https://api.github.com/')||r.status()<400)return;if(r.status()===404&&(expectedWorkspace404||expectedMutation404))return;evidence.runtime.apiErrors.push({url:r.url(),status:r.status()})});"
          if s.count(old)!=1: raise SystemExit(f'runtime listener anchor count {s.count(old)}')
          s=s.replace(old,new,1)
          old="await connect(page);await importAndSave(page,planProject(),'c04-v3-plan.json');expected404=false;await importAndSave(page,workloadProject(),'c04-v3-workload.json');"
          new="await connect(page);expectedWorkspace404=false;expectedMutation404=true;await importAndSave(page,planProject(),'c04-v3-plan.json');expectedMutation404=false;expectedMutation404=true;await importAndSave(page,workloadProject(),'c04-v3-workload.json');expectedMutation404=false;"
          if s.count(old)!=1: raise SystemExit(f'import runtime window anchor count {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check tests/c04-ui-usability-v3.e2e.cjs
          grep -q 'expectedMutation404=true' tests/c04-ui-usability-v3.e2e.cjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/c04-ui-usability-v3.e2e.cjs
          git commit -m 'test: classify expected new-save 404 separately'
          git push origin HEAD:c04-v3-decision-ui-implementation-20260912
