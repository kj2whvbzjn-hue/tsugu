name: TSUGU Impact Graph E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'static/core-impact-graph.js'
      - 'tests/core-impact-graph.test.cjs'
      - 'static/index.html'
      - '.github/workflows/pages.yml'
      - '.github/workflows/impact-graph-e2e.yml'
      - 'docs/TSUGU_CORE_VNEXT_C01.md'
      - 'change-records/C-01.json'
  workflow_run:
    workflows: ['Deploy TSUGU']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: tsugu-impact-graph-e2e-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  e2e:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify C-01 relation-aware contracts
        run: |
          node --check static/core-impact-graph.js
          node --check tests/core-impact-graph.test.cjs
          node --test tests/core-impact-graph.test.cjs

      - name: Verify published Impact Graph module
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          E2E_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          curl -fsSL "https://kj2whvbzjn-hue.github.io/tsugu/core-impact-graph.js?run=${E2E_RUN_ID}" -o /tmp/published-core-impact-graph.js
          cmp static/core-impact-graph.js /tmp/published-core-impact-graph.js

      - name: Verify real GitHub B-05 compare to C-01 Impact Graph flow
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN_E2E: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          E2E_RUN_ID: ${{ github.run_id }}
          E2E_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node <<'NODE'
          (async()=>{
            const assert=require('node:assert/strict');
            const fs=require('node:fs');
            const Architecture=require('./static/core-architecture.js');
            const Box=require('./static/core-box.js');
            const RuleTest=require('./static/core-rule-test.js');
            const Git=require('./static/core-git-diff.js');
            const Impact=require('./static/core-impact-graph.js');
            const owner='kj2whvbzjn-hue',repo='tsugu',token=process.env.GH_TOKEN_E2E,projectId='project:c01:e2e';
            const branch=`c01-e2e-${process.env.E2E_RUN_ID}-${process.env.E2E_RUN_ATTEMPT}`;
            const targetPath=`data/e2e/c01-target-${process.env.E2E_RUN_ID}-${process.env.E2E_RUN_ATTEMPT}.txt`;
            const headers={Accept:'application/vnd.github+json',Authorization:`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28','User-Agent':'tsugu-c01-e2e'};
            async function api(p,options={},allow404=false){const r=await fetch(`https://api.github.com${p}`,{...options,headers:{...headers,...(options.headers||{})}});const text=await r.text();if(allow404&&r.status===404)return null;if(!r.ok)throw new Error(`GitHub ${r.status}: ${text}`);return text?JSON.parse(text):null;}
            async function put(path,message,content,sha){return api(`/repos/${owner}/${repo}/contents/${path}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,content:Buffer.from(content).toString('base64'),branch,...(sha?{sha}:{})})});}
            await api(`/repos/${owner}/${repo}/git/refs`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ref:`refs/heads/${branch}`,sha:process.env.SOURCE_SHA})});
            try{
              const first=await put(targetPath,'C-01 E2E base','base\n');
              const baseSha=first.commit.sha,baseBlob=first.content.sha;
              const second=await put(targetPath,'C-01 E2E head','head\n',baseBlob);
              const headSha=second.commit.sha,file=targetPath.split('/').pop();
              let a=Architecture.createProjectArchitecture({projectId,name:'C01 E2E',repositoryScopes:[{repositoryId:1,fullName:`${owner}/${repo}`}]});
              a=Architecture.addArchitectureNode(a,{id:'node:root',name:'Root'});
              a=Architecture.addArchitectureNode(a,{id:'node:leaf',name:'Leaf',parentNodeId:'node:root'});
              a=Architecture.addPathEntry(a,{id:'path:data',repositoryId:1,kind:'DIRECTORY',name:'data'});
              a=Architecture.addPathEntry(a,{id:'path:e2e',repositoryId:1,kind:'DIRECTORY',name:'e2e',parentPathEntryId:'path:data'});
              a=Architecture.addPathEntry(a,{id:'path:target',repositoryId:1,kind:'FILE',name:file,parentPathEntryId:'path:e2e'});
              a=Architecture.addBinding(a,{id:'binding:tests',pathEntryId:'path:target',architectureNodeId:'node:leaf',relation:'TESTS'});
              let b=Box.seedSystemDefinitions(Box.migrateFromStageA(a));
              b=Box.createBoxInstance(b,{id:'box:root',boxDefinitionId:'system:box:component',boxDefinitionVersion:1,architectureNodeId:'node:root',config:{name:'root'}});
              b=Box.createBoxInstance(b,{id:'box:leaf',boxDefinitionId:'system:box:leaf',boxDefinitionVersion:1,architectureNodeId:'node:leaf',parentBoxInstanceId:'box:root',config:{name:'leaf'}});
              let r=RuleTest.migrateFromB01(b);
              r=RuleTest.createRuleDraft(r,{id:'rule:c01',version:1,name:'rule:c01',constraints:[{type:'MIN',key:'coverage',value:70}]});
              r=RuleTest.publishRuleDefinition(r,'rule:c01',1,{now:'2026-09-12T00:00:00Z'});
              r=RuleTest.addRuleBinding(r,{id:'rule-binding:c01',ruleDefinitionId:'rule:c01',ruleDefinitionVersion:1,targetType:'BOX_INSTANCE',boxInstanceId:'box:leaf',inheritToChildren:false});
              r=RuleTest.createTestDraft(r,{id:'test:c01',version:1,name:'test:c01',runner:'shell',command:'true',evaluationConditions:{exitCode:0}});
              r=RuleTest.publishTestDefinition(r,'test:c01',1,{now:'2026-09-12T00:01:00Z'});
              r=RuleTest.addRequirementSource(r,{id:'requirement-source:c01',sourceBoxDefinitionId:'system:box:leaf',sourceBoxDefinitionVersion:1,testDefinitionId:'test:c01',testDefinitionVersion:1,scope:'SELF'});
              r=RuleTest.deriveRequirements(r);
              const capture=await Git.captureComparison({fetch,owner,repo,projectId,repositoryId:1,baseCommitSha:baseSha,headCommitSha:headSha,architecture:a,token,now:'2026-09-12T00:02:00Z'});
              assert.equal(capture.files.length,1);assert.equal(capture.files[0].pathEntryId,'path:target');assert.equal(capture.files[0].mappingStatus,'MAPPED');
              const graph=Impact.buildImpactGraph({ruleTestRegistry:r,actualChange:{...capture,id:'actual:c01:e2e',projectId}});
              assert.equal(graph.requiresFullTest,false);assert.equal(graph.status,'TARGETED');
              assert.equal(graph.relationImpacts.TESTS.requirementIds.length,1);assert.equal(graph.relationImpacts.IMPLEMENTS.requirementIds.length,0);
              assert.equal(graph.impacts[0].relation,'TESTS');assert.match(graph.impactHash,/^sha256:[a-f0-9]{64}$/);
              fs.writeFileSync('c01-impact-evidence.json',JSON.stringify({type:'C01ImpactGraphE2EEvidence',sourceSha:process.env.SOURCE_SHA,baseSha,headSha,capture:{gitDiffHash:capture.gitDiffHash,files:capture.files},graph},null,2)+'\n');
              console.log(`C-01 E2E PASS impactHash=${graph.impactHash} base=${baseSha} head=${headSha}`);
            }finally{
              await api(`/repos/${owner}/${repo}/git/refs/heads/${encodeURIComponent(branch)}`,{method:'DELETE'},true).catch(()=>null);
            }
          })().catch(e=>{console.error(e.stack||e);process.exit(1);});
          NODE

      - name: Upload C-01 Impact Graph evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c01-impact-evidence-${{ github.run_id }}
          path: c01-impact-evidence.json
          if-no-files-found: ignore
