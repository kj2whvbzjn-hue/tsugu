name: TSUGU C-04 UI Usability E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'static/c04-ui-usability-plan.json'
      - 'tests/c04-ui-usability.e2e.cjs.gz.b64.part*'
      - '.github/workflows/c04-ui-usability-e2e.yml'
      - 'static/**'
      - 'change-records/C-04.json'
      - 'docs/TSUGU_CORE_VNEXT_C04.md'
  workflow_run:
    workflows: ['Deploy TSUGU']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tsugu-c04-ui-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  ui-usability:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Decode and verify frozen C-04 E2E
        shell: bash
        run: |
          set -euo pipefail
          cat tests/c04-ui-usability.e2e.cjs.gz.b64.part00 \
              tests/c04-ui-usability.e2e.cjs.gz.b64.part01 \
              tests/c04-ui-usability.e2e.cjs.gz.b64.part02 \
              tests/c04-ui-usability.e2e.cjs.gz.b64.part03 \
              tests/c04-ui-usability.e2e.cjs.gz.b64.part04 \
            | base64 --decode | gzip --decompress > tests/.c04-ui-usability.e2e.cjs
          test "$(sha256sum tests/.c04-ui-usability.e2e.cjs | awk '{print $1}')" = "c3f1ab5d3872fafa2dfa946da3b1390e1d6ca75e410a5effce3138a1d7f9a9fb"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/.c04-ui-usability.e2e.cjs')
          s=p.read_text()
          s=s.replace("const sourceSha=process.env.GITHUB_SHA || '';\nif(!token)", "const sourceSha=process.env.GITHUB_SHA || '';\nconst targetUrl=process.env.C04_TARGET_URL || plan.target.publishedUrl;\nif(!token)")
          s=s.replace("tempBranch,status:'RUNNING'", "tempBranch,targetUrl,status:'RUNNING'")
          s=s.replace("await page.goto(`${plan.target.publishedUrl}?c04=${runId}`", "await page.goto(`${targetUrl}?c04=${runId}`")
          p.write_text(s)
          PY
          node --check tests/.c04-ui-usability.e2e.cjs
          test "$(sha256sum tests/.c04-ui-usability.e2e.cjs | awk '{print $1}')" = "998a299116a253f358aa2ba91a6bff9b310ede7fe2fe49de754aa1bea4008e45"
          node -e "const p=require('./static/c04-ui-usability-plan.json'); if(p.status!=='FROZEN_BEFORE_EXECUTION'||p.version!==1)process.exit(1)"

          # Contents API can briefly return 404 immediately after a new save on the isolated branch.
          # Retry only those transient readProject 404s; all other errors still fail immediately.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/.c04-ui-usability.e2e.cjs')
          s=p.read_text()
          read_marker='async function readProject('
          find_marker='async function findSavedByPrefix('
          if read_marker not in s or find_marker not in s:
              raise SystemExit('readback retry anchors not found')
          s=s.replace(read_marker,'async function readProjectOnce(',1)
          wrapper="async function readProject(...args){for(let i=0;i<12;i++){try{return await readProjectOnce(...args);}catch(e){if(!String(e&&e.message||e).includes('GitHub 404')||i===11)throw e;await new Promise(r=>setTimeout(r,500));}}}\n"
          s=s.replace(find_marker,wrapper+find_marker,1)
          p.write_text(s)
          PY

          # Verify deletion only after the whole visible project list settles to the expected identities.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/.c04-ui-usability.e2e.cjs')
          s=p.read_text()
          old1="for(let i=0;i<30&&(await listProjects()).length!==1;i++)await page.waitForTimeout(250);assert.equal((await listProjects()).length,1);await page.getByText(/C-04 UI\\/使用性テスト計画 v1（取込）/).first().waitFor({state:'visible',timeout:15000});assert.equal(await page.getByText(/C-04 UI負荷・使用性テスト 196項目（取込）/).count(),0);"
          new1="const visibleProjectTexts=async()=>page.locator('.project-list button').evaluateAll(els=>els.filter(e=>{const r=e.getBoundingClientRect();const s=getComputedStyle(e);return r.width>0&&r.height>0&&s.visibility!=='hidden'&&s.display!=='none';}).map(e=>(e.textContent||'').trim()));let afterOne=[];for(let i=0;i<120;i++){afterOne=await visibleProjectTexts();if(afterOne.length===1&&afterOne[0].includes('C-04 UI/使用性テスト計画 v1（取込）')&&!afterOne[0].includes('196項目'))break;await page.waitForTimeout(250);}assert.equal(afterOne.length,1);assert.match(afterOne[0],/C-04 UI\\/使用性テスト計画 v1（取込）/);for(let i=0;i<60&&(await listProjects()).length!==1;i++)await page.waitForTimeout(250);assert.equal((await listProjects()).length,1);"
          old2="for(let i=0;i<30&&(await listProjects()).length!==0;i++)await page.waitForTimeout(250);assert.equal((await listProjects()).length,0);await page.getByText('まだ案件がありません。',{exact:true}).waitFor({state:'visible',timeout:15000});evidence.cleanup={remainingProjects:0};markScenario('UI-09','PASS');"
          new2="let afterZero=[];for(let i=0;i<120;i++){afterZero=await visibleProjectTexts();if(afterZero.length===0&&await page.getByText('まだ案件がありません。',{exact:true}).isVisible())break;await page.waitForTimeout(250);}assert.equal(afterZero.length,0);await page.getByText('まだ案件がありません。',{exact:true}).waitFor({state:'visible',timeout:30000});for(let i=0;i<60&&(await listProjects()).length!==0;i++)await page.waitForTimeout(250);assert.equal((await listProjects()).length,0);evidence.cleanup={remainingProjects:0,visibleProjects:afterZero};markScenario('UI-09','PASS');"
          old3="const planCard=page.getByText(/C-04 UI\\/使用性テスト計画 v1（取込）/).first();"
          new3="const planCard=page.locator('.project-list button').filter({hasText:/C-04 UI\\/使用性テスト計画 v1（取込）/}).first();"
          if old1 not in s or old2 not in s or old3 not in s:
              raise SystemExit('delete/reload settled-list anchors not found')
          s=s.replace(old1,new1).replace(old2,new2).replace(old3,new3)
          p.write_text(s)
          PY
          node --check tests/.c04-ui-usability.e2e.cjs
          echo '--- C-04 delete/reload settled-list source ---'
          nl -ba tests/.c04-ui-usability.e2e.cjs | sed -n '191,202p'

      - name: Build candidate Pages site
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -a static/. _site/
          base64 --decode static/app.js.gz.b64 | gzip --decompress > _site/app.js
          rm -f _site/app.js.gz.b64
          node --check _site/app.js

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Register frozen plan and execute UI usability tests
        env:
          GH_TOKEN_E2E: ${{ github.token }}
          C04_TARGET_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4173/' || 'https://kj2whvbzjn-hue.github.io/tsugu/' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 -m http.server 4173 --directory _site >/tmp/c04-http.log 2>&1 &
            SERVER_PID=$!
            trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
              sleep 1
            done
          fi
          node tests/.c04-ui-usability.e2e.cjs

      - name: Upload C-04 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c04-ui-usability-evidence-${{ github.run_id }}
          path: |
            c04-ui-usability-evidence.json
            c04-mobile.png
            c04-desktop.png
          if-no-files-found: ignore
