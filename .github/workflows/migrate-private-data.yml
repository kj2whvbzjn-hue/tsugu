name: Migrate TSUGU Pages to private data repository

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-private-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch static app data repository settings
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode static/app.js.gz.b64 | gzip --decompress > /tmp/app.js
          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/app.js')
          text = path.read_text()
          replacements = [
              ("const DEFAULTS={owner:'kj2whvbzjn-hue',repo:'tsugu',branch:'tsugu-data'};", "const DEFAULTS={owner:'kj2whvbzjn-hue',repo:'tsugu-data',branch:'main'};"),
              ("const user=await gh('/user');await gh(`/repos/${owner}/${repo}`);state.user=user;", "const user=await gh('/user');const repository=await gh(`/repos/${owner}/${repo}`);if(!repository.private)throw new Error('案件データの保存先はPrivateリポジトリにしてください');state.user=user;"),
              ("GitHub ${user.login} と接続しました。トークンはこのページのメモリ内だけに保持します。", "GitHub ${user.login} とPrivateデータリポジトリ ${owner}/${repo} に接続しました。トークンはこのページのメモリ内だけに保持します。"),
              ("GitHub Pages 静的版 — 案件データはGitHubリポジトリに保存します。", "GitHub Pages 静的版 — 公開UIと案件データを分離し、案件データはPrivate GitHubリポジトリに保存します。"),
              ("<span>Repository</span>", "<span>Private data repository</span>"),
              ("推奨権限: このリポジトリだけを対象に", "推奨権限: Privateデータリポジトリだけを対象に"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:80]}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          node --check /tmp/app.js
          gzip -n -c /tmp/app.js | base64 -w 0 > static/app.js.gz.b64
          printf '\n' >> static/app.js.gz.b64

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js.gz.b64
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Use private tsugu-data repository for TSUGU records'
          git push
