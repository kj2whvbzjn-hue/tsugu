name: TSUGU Governance E2E

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy TSUGU']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: tsugu-governance-e2e
  cancel-in-progress: true

jobs:
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Verify B-03 contracts
        run: node --test tests/core-governance.test.cjs
      - name: Verify published modules and GitHub Governance ChangeSet flow
        env:
          GH_TOKEN_E2E: ${{ github.token }}
          E2E_RUN_ID: ${{ github.run_id }}
          E2E_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          curl -fsSL "https://kj2whvbzjn-hue.github.io/tsugu/core-governance.js?run=${E2E_RUN_ID}" -o /tmp/published-core-governance.js
          curl -fsSL "https://kj2whvbzjn-hue.github.io/tsugu/core-governance-changeset.js?run=${E2E_RUN_ID}" -o /tmp/published-core-governance-changeset.js
          cmp static/core-governance.js /tmp/published-core-governance.js
          cmp static/core-governance-changeset.js /tmp/published-core-governance-changeset.js
          node <<'NODE'
          (async()=>{
            const assert=require('node:assert/strict');
            const crypto=require('node:crypto');
            const G=require('./static/core-governance.js');
            const CS=require('./static/core-governance-changeset.js');
            const owner='kj2whvbzjn-hue',repo='tsugu';
            const branch=`b03-e2e-${process.env.E2E_RUN_ID}-${process.env.E2E_RUN_ATTEMPT}`;
            const path=`data/e2e/b03-${process.env.E2E_RUN_ID}-${process.env.E2E_RUN_ATTEMPT}.json`;
            const token=process.env.GH_TOKEN_E2E,sourceSha=process.env.SOURCE_SHA;
            const actor={id:'github-actions[bot]',subject:'github-actions',kind:'BOT',role:'PROJECT_ADMIN'};
            const headers={Accept:'application/vnd.github+json',Authorization:`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28','User-Agent':'tsugu-b03-e2e'};
            const h=s=>'sha256:'+crypto.createHash('sha256').update(s).digest('hex');
            const ref=(type,id)=>({type,id,version:1,hash:h(`${type}:${id}`)});
            async function api(p,options={},allow404=false){const r=await fetch(`https://api.github.com${p}`,{...options,headers:{...headers,...(options.headers||{})}});const text=await r.text();if(allow404&&r.status===404)return null;if(!r.ok)throw new Error(`GitHub ${r.status}: ${text}`);return text?JSON.parse(text):null;}
            await api(`/repos/${owner}/${repo}/git/refs`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ref:`refs/heads/${branch}`,sha:sourceSha})});
            try{
              const initial=CS.createAggregate(G.createRegistry({projectId:'project:b03:e2e'}));
              const created=await api(`/repos/${owner}/${repo}/contents/${path}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Initialize B-03 E2E aggregate',content:Buffer.from(CS.stableStringify(initial)).toString('base64'),branch})});
              const cs=CS.createChangeSet({id:'governance-changeset:b03:e2e',projectId:initial.projectId,idempotencyKey:'idem:b03:e2e',baseRevision:initial.revision,baseBlobSha:created.content.sha,operations:[
                {type:'CREATE_TASK',id:'task:b03:e2e',name:'B-03 task',subject:ref('BOX_INSTANCE','box:e2e'),purpose:'exercise governance',startConditions:[{type:'EVENT',ref:ref('EVENT','event:start')}],completionConditions:[{type:'CHECK',ref:ref('REQUIREMENT_SNAPSHOT','snapshot:final')}],at:'2026-09-11T06:00:00Z'},
                {type:'CREATE_DECISION',id:'decision:b03:e2e',version:1,title:'Keep B-06 execution gate',rationale:'B-03 must not self-authorize Task execution',refs:[ref('TASK','task:b03:e2e')],at:'2026-09-11T06:01:00Z'},
                {type:'CREATE_ISSUE',id:'issue:b03:e2e',title:'Synthetic issue',description:'E2E history check',sourceCheckIds:['check:synthetic:fail'],taskId:'task:b03:e2e',at:'2026-09-11T06:02:00Z'}
              ]});
              const v=CS.validateChangeSet(initial,created.content.sha,cs,{actor,now:'2026-09-11T06:02:10Z'});
              const applied=await CS.applyWithContentApi({fetch,owner,repo,branch,path,token,changeSet:cs,validationRecord:v.validationRecord,actor,now:'2026-09-11T06:03:00Z'});
              assert.equal(applied.status,'APPLIED');
              assert.throws(()=>G.createApproval(v.candidate,{id:'approval:bot',approvalType:'FINAL',target:G.taskApprovalTarget(v.candidate,'task:b03:e2e'),policyVersion:'p1',humanRequired:true,expiresAt:'2026-09-12T00:00:00Z'},{actor,now:'2026-09-11T06:04:00Z'}),e=>e.code==='HUMAN_APPROVAL_REQUIRED');
              assert.throws(()=>G.startTask(v.candidate,'task:b03:e2e'),e=>e.code==='TASK_EVALUATION_NOT_AVAILABLE_UNTIL_B06');
              console.log(`B-03 E2E PASS commit=${applied.commitSha}`);
            }finally{
              await api(`/repos/${owner}/${repo}/git/refs/heads/${encodeURIComponent(branch)}`,{method:'DELETE'},true).catch(()=>null);
            }
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
