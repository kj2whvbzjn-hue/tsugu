name: TSUGU C-04 Materialize UI Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/c04-materialize-ui.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.head_ref == 'vnext-c04-ui-usability-20260912' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Repair C-04 v2 assertion harness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/c04-ui-usability-v2.e2e.cjs')
          s=p.read_text()
          old="assert.equal((await page.locator('[data-item-row]').evaluateAll(rows=>rows.every(r=>(r.textContent||'').includes('検証'))),true));"
          new="assert.equal(await page.locator('[data-item-row]').evaluateAll(rows=>rows.every(r=>(r.textContent||'').includes('検証'))),true);"
          if s.count(old)!=1:
              raise SystemExit('expected malformed assertion exactly once')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check tests/c04-ui-usability-v2.e2e.cjs
          grep -Fq "assert.equal(await page.locator('[data-item-row]').evaluateAll" tests/c04-ui-usability-v2.e2e.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/c04-ui-usability-v2.e2e.cjs
          git diff --cached --check
          git commit -m 'C-04: fix v2 filter assertion harness'
          git push origin HEAD:${{ github.head_ref }}
