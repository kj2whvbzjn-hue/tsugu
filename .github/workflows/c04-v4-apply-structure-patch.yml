name: C-04 v4 Apply Structure UI Patch

on:
  push:
    branches: [c04-v4-core-structure-navigation-20260912]
    paths:
      - 'tools/c04_v4_structure_patch.py'
      - '.github/workflows/c04-v4-apply-structure-patch.yml'

permissions:
  contents: write

concurrency:
  group: c04-v4-apply-structure-patch
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c04-v4-core-structure-navigation-20260912
          fetch-depth: 0
      - name: Apply structural UI patch and harness-only selector repair
        run: |
          set -euo pipefail
          base64 --decode static/app.js.gz.b64 | gzip --decompress > /tmp/c04-v4-current-app.js
          if grep -q 'C04_STRUCTURE_UI_V4' /tmp/c04-v4-current-app.js; then
            cp /tmp/c04-v4-current-app.js /tmp/c04-v4-app.js
            echo 'C-04 v4 patch already applied'
          else
            python3 tools/c04_v4_structure_patch.py
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/c04-structure-ui-v4.e2e.cjs')
          s=p.read_text()
          s=s.replace("inspector.getByRole('button',{name:'Root Architecture',exact:true})", "inspector.getByRole('button',{name:/Root Architecture/,exact:false})")
          s=s.replace("inspector.getByRole('button',{name:'Box Alpha',exact:true})", "inspector.getByRole('button',{name:/Box Alpha/,exact:false})")
          p.write_text(s)
          PY
          node --check /tmp/c04-v4-app.js
          node --input-type=module --check < /tmp/c04-v4-app.js
          node --check tests/c04-structure-ui-v4.e2e.cjs
          grep -q 'C04_STRUCTURE_UI_V4' /tmp/c04-v4-app.js
          grep -q 'function renderStructureMap' /tmp/c04-v4-app.js
          grep -q 'function renderDependencyTab' /tmp/c04-v4-app.js
      - name: Commit patched application and harness repair
        run: |
          set -euo pipefail
          if git diff --quiet -- static/app.js.gz.b64 tests/c04-structure-ui-v4.e2e.cjs; then
            echo 'No patch needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js.gz.b64 tests/c04-structure-ui-v4.e2e.cjs
          git commit -m 'test: align v4 relation selectors with typed labels'
          git pull --rebase origin c04-v4-core-structure-navigation-20260912
          git push origin HEAD:c04-v4-core-structure-navigation-20260912
