name: Engineering Design Graph E2E
on:
  pull_request:
    branches: [main]
    paths:
      - 'engineering-design-graph/**'
      - 'tests/engineering-design*.mjs'
      - 'tests/engineering-design*.cjs'
      - 'package.json'
      - '.github/workflows/engineering-design-graph-e2e.yml'
      - '.github/workflows/engineering-design-graph-release.yml'
  push:
    branches:
      - 'feature/engineering-design-graph-mvp'
    paths:
      - 'engineering-design-graph/**'
      - 'tests/engineering-design*.mjs'
      - 'tests/engineering-design*.cjs'
      - 'package.json'
      - '.github/workflows/engineering-design-graph-e2e.yml'
      - '.github/workflows/engineering-design-graph-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d edg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: edg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PostgreSQL runtime dependency
        run: npm install --no-save --package-lock=false pg@8.16.3
      - name: Apply PostgreSQL migrations with production runner and verify schema
        run: |
          node engineering-design-graph/migrate.mjs
          node engineering-design-graph/migrate.mjs
          test "$(psql -Atc "select count(*) from schema_migrations")" = "4"
          test "$(psql -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('schema_migrations','projects','artifacts','artifact_versions','relations','change_sets','change_set_items','validation_issues','ai_candidates','reviews','readiness_snapshots','audit_logs','outbox_events','project_members','project_policies','rate_limit_buckets')")" = "16"
          PROJECT_ID="$(psql -qAtc "with inserted as (insert into projects(name) values ('CI migration smoke') returning id) select id from inserted")"
          psql -v ON_ERROR_STOP=1 -c "insert into project_members(project_id,user_subject,role) values ('$PROJECT_ID','oidc|user@example.test','architect');"
          psql -v ON_ERROR_STOP=1 -c "insert into project_policies(project_id,policy,updated_by) values ('$PROJECT_ID','{\"aiEnabled\":true}'::jsonb,'oidc|user@example.test');"
          psql -v ON_ERROR_STOP=1 -c "insert into change_sets(project_id,title,base_revision,actor_user_id) values ('$PROJECT_ID','OIDC subject smoke',1,'oidc|user@example.test');"
          psql -v ON_ERROR_STOP=1 -c "insert into audit_logs(project_id,actor_user_id,action,target_type,target_id,trace_id) values ('$PROJECT_ID','oidc|user@example.test','PATCH smoke','artifact','REQ-SMOKE','trace-ci');"
          psql -v ON_ERROR_STOP=1 -c "insert into outbox_events(aggregate_type,aggregate_id,event_type,payload) values ('artifact','REQ-SMOKE','artifact.updated','{}'::jsonb);"
          psql -v ON_ERROR_STOP=1 -c "insert into rate_limit_buckets(bucket_key,request_count) values ('ci-user',1);"
      - name: Run Engineering Design Graph domain, API, AI, security and package tests
        run: npm test
      - name: Validate container and deployment manifests
        run: |
          docker build -f engineering-design-graph/Dockerfile -t engineering-design-graph:ci .
          grep -q '/health/ready' engineering-design-graph/ops/k8s.yaml
          grep -q '/health/live' engineering-design-graph/ops/k8s.yaml
          grep -q 'terminationGracePeriodSeconds: 30' engineering-design-graph/ops/k8s.yaml
          grep -q 'RATE_LIMIT_BACKEND: "postgres"' engineering-design-graph/ops/k8s.yaml
          grep -q 'RATE_LIMIT_BACKEND: "memory"' engineering-design-graph/ops/environments/dev.patch.yaml
          grep -q 'RATE_LIMIT_BACKEND: "postgres"' engineering-design-graph/ops/environments/prod.patch.yaml
          grep -q 'EngineeringDesignGraphOutboxPublishFailures' engineering-design-graph/ops/alerts.example.yaml
          grep -q 'npm","run","migrate' engineering-design-graph/ops/migrate-job.yaml
          grep -q 'workflow_dispatch:' .github/workflows/engineering-design-graph-release.yml
          grep -q 'inputs.publish' .github/workflows/engineering-design-graph-release.yml
          grep -q 'REPLACE_AT_DEPLOY_TIME' engineering-design-graph/ops/k8s.yaml
          ! grep -Eq '(postgres(ql)?://[^ ]+:[^ ]+@|BEGIN PRIVATE KEY|AKIA[0-9A-Z]{16})' engineering-design-graph/ops/k8s.yaml
      - name: Run pooled runtime against real PostgreSQL
        run: node tests/engineering-design-postgres.integration.mjs
      - name: Verify PostgreSQL backup and restore drill
        run: |
          ORIGINAL_PROJECTS="$(psql -Atc 'select count(*) from projects')"
          ORIGINAL_VERSIONS="$(psql -Atc 'select count(*) from artifact_versions')"
          pg_dump --format=custom --no-owner --no-acl --file=/tmp/edg.dump edg
          sha256sum /tmp/edg.dump > /tmp/edg.dump.sha256
          createdb edg_restore
          pg_restore --no-owner --no-acl --dbname=edg_restore /tmp/edg.dump
          test "$(psql -d edg_restore -Atc 'select count(*) from projects')" = "$ORIGINAL_PROJECTS"
          test "$(psql -d edg_restore -Atc 'select count(*) from artifact_versions')" = "$ORIGINAL_VERSIONS"
          test "$(psql -d edg_restore -Atc "select count(*) from schema_migrations")" = "4"
          test "$(psql -d edg_restore -Atc "select count(*) from information_schema.tables where table_schema='public'")" -ge 16
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve isolated Engineering Design Graph app
        run: |
          python3 -m http.server 4174 --directory . > /tmp/engineering-design-graph-server.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4174/engineering-design-graph/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/engineering-design-graph-server.log
          exit 1
      - name: Run Playwright UI and authenticated HTTP E2E
        run: npm run test:engineering-design:e2e
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-design-graph-e2e-${{ github.sha }}
          path: |
            outputs/engineering-design-graph/
            /tmp/engineering-design-graph-server.log
            /tmp/edg.dump.sha256
          if-no-files-found: warn
