name: B-04 Materialize

on:
  push:
    branches: [vnext-b04-20260911]
    paths:
      - '.b04bundle/**'
      - '.github/workflows/b04-materialize.yml'

permissions:
  contents: write

concurrency:
  group: b04-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: vnext-b04-20260911
      - name: Materialize verified B-04 sources
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import base64, gzip
          mapping = {
            '.b04bundle/core-check-evidence.js.gz.b64': 'static/core-check-evidence.js',
            '.b04bundle/core-evidence-storage.js.gz.b64': 'static/core-evidence-storage.js',
            '.b04bundle/core-check-evidence-changeset.js.gz.b64': 'static/core-check-evidence-changeset.js',
            '.b04bundle/core-check-evidence.test.cjs.gz.b64': 'tests/core-check-evidence.test.cjs',
            '.b04bundle/TSUGU_CORE_VNEXT_B04.md.gz.b64': 'docs/TSUGU_CORE_VNEXT_B04.md',
            '.b04bundle/B-04.json.gz.b64': 'change-records/B-04.json',
            '.b04bundle/index.html.gz.b64': 'static/index.html',
            '.b04bundle/pages.yml.gz.b64': '.github/workflows/pages.yml',
            '.b04bundle/check-evidence-e2e.yml.gz.b64': '.github/workflows/check-evidence-e2e.yml',
          }
          for source, target in mapping.items():
            raw = Path(source).read_text().strip()
            data = gzip.decompress(base64.b64decode(raw))
            p = Path(target)
            p.parent.mkdir(parents=True, exist_ok=True)
            p.write_bytes(data)
          PY
          node --check static/core-check-evidence.js
          node --check static/core-evidence-storage.js
          node --check static/core-check-evidence-changeset.js
          node --test tests/core-check-evidence.test.cjs
      - name: Commit materialized B-04 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/core-check-evidence.js static/core-evidence-storage.js static/core-check-evidence-changeset.js tests/core-check-evidence.test.cjs docs/TSUGU_CORE_VNEXT_B04.md change-records/B-04.json static/index.html .github/workflows/pages.yml .github/workflows/check-evidence-e2e.yml
          git rm -r .b04bundle
          git rm .github/workflows/b04-materialize.yml
          git commit -m 'Implement B-04 Check Evidence contracts'
          git push origin HEAD:vnext-b04-20260911
