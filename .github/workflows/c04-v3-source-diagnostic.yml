name: C04 v3 source diagnostic

on:
  push:
    branches:
      - c04-v3-decision-ui-implementation-20260912
    paths:
      - .github/workflows/c04-v3-source-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Decode and locate duplicate relation helpers
        run: |
          python - <<'PY'
          import base64,gzip,pathlib,re
          raw=pathlib.Path('static/app.js.gz.b64').read_text().strip()
          text=gzip.decompress(base64.b64decode(raw)).decode()
          needles=['relationResolutionHtml','relationCandidates','resolveRelationInput','relationOptionsHtml','relationBreadcrumbHtml','openRelatedItem','jumpRelation']
          for needle in needles:
              print('\n===== NEEDLE',needle,'=====')
              matches=[m.start() for m in re.finditer(re.escape(needle),text)]
              print('COUNT',len(matches),'POSITIONS',matches)
              for n,i in enumerate(matches,1):
                  lo=max(0,i-700); hi=min(len(text),i+1200)
                  print(f'--- occurrence {n} index {i} ---')
                  print(text[lo:hi].replace(';',';\n'))
          print('APP_LENGTH',len(text))
          PY
