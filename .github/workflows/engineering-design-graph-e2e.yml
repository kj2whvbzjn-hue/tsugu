name: Engineering Design Graph E2E
on:
  pull_request:
    branches: [main]
    paths:
      - 'engineering-design-graph/**'
      - 'tests/engineering-design*.mjs'
      - 'tests/engineering-design*.cjs'
      - 'package.json'
      - '.github/workflows/engineering-design-graph-e2e.yml'
  push:
    branches:
      - 'feature/engineering-design-graph-mvp'
    paths:
      - 'engineering-design-graph/**'
      - 'tests/engineering-design*.mjs'
      - 'tests/engineering-design*.cjs'
      - 'package.json'
      - '.github/workflows/engineering-design-graph-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d edg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply PostgreSQL migration and verify schema
        run: |
          psql -h 127.0.0.1 -U postgres -d edg -v ON_ERROR_STOP=1 -f engineering-design-graph/db/001_initial.sql
          test "$(psql -h 127.0.0.1 -U postgres -d edg -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('projects','artifacts','artifact_versions','relations','change_sets','change_set_items','validation_issues','ai_candidates','reviews','readiness_snapshots','audit_logs','outbox_events')")" = "12"
          PROJECT_ID="$(psql -h 127.0.0.1 -U postgres -d edg -Atc "insert into projects(name) values ('CI migration smoke') returning id")"
          psql -h 127.0.0.1 -U postgres -d edg -v ON_ERROR_STOP=1 -c "insert into change_sets(project_id,title,base_revision,actor_user_id) values ('$PROJECT_ID','OIDC subject smoke',1,'oidc|user@example.test');"
          psql -h 127.0.0.1 -U postgres -d edg -v ON_ERROR_STOP=1 -c "insert into audit_logs(project_id,actor_user_id,action,target_type,target_id,trace_id) values ('$PROJECT_ID','oidc|user@example.test','PATCH smoke','artifact','REQ-SMOKE','trace-ci');"
          psql -h 127.0.0.1 -U postgres -d edg -v ON_ERROR_STOP=1 -c "insert into outbox_events(aggregate_type,aggregate_id,event_type,payload) values ('artifact','REQ-SMOKE','artifact.updated','{}'::jsonb);"
      - name: Run Engineering Design Graph domain, API, AI, security and package tests
        run: npm test
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve isolated Engineering Design Graph app
        run: |
          python3 -m http.server 4174 --directory . > /tmp/engineering-design-graph-server.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4174/engineering-design-graph/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/engineering-design-graph-server.log
          exit 1
      - name: Run Playwright UI and authenticated HTTP E2E
        run: npm run test:engineering-design:e2e
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-design-graph-e2e-${{ github.sha }}
          path: |
            outputs/engineering-design-graph/
            /tmp/engineering-design-graph-server.log
          if-no-files-found: warn
