name: TSUGU C-04 v3 Apply Decision UI Patch

on:
  push:
    branches:
      - c04-v3-decision-ui-implementation-20260912
    paths:
      - '.github/workflows/c04-v3-apply-ui-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c04-v3-decision-ui-implementation-20260912
          fetch-depth: 1
      - name: Materialize C-04 v3 decision-centered UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,re

          app_path=Path('static/app.js.gz.b64')
          text=gzip.decompress(base64.b64decode(app_path.read_text().strip())).decode()

          def replace_func(src,name,next_name,new_body):
              start=src.find(f'function {name}')
              if start < 0: raise SystemExit(f'missing function {name}')
              end=src.find(f'function {next_name}',start)
              if end < 0: raise SystemExit(f'missing next function {next_name} after {name}')
              return src[:start]+new_body.strip()+'\n'+src[end:]

          sidebar=r'''function renderSidebar(){return `<aside class="sidebar"><div class="brand"><div class="brand-mark">継</div><div><h1>TSUGU</h1><small>GitHub workspace</small></div></div><div class="status"><strong>${esc(state.user.login)}</strong><small>${esc(state.repo.owner)}/${esc(state.repo.repo)} · ${esc(state.repo.branch)}</small></div><button class="primary" id="newBtn">＋ 新規案件</button><div class="workspace-menu"><button id="workspaceMenuBtn" aria-haspopup="menu" aria-expanded="false">接続・取込メニュー</button><div id="workspaceMenuPanel" class="workspace-menu-panel" role="menu" hidden><button role="menuitem" id="importBtn">JSONから新規取込</button><button role="menuitem" id="reloadBtn">GitHubから再読込</button><button role="menuitem" id="disconnectBtn">接続解除</button></div></div><input id="importFile" class="sr-only" type="file" accept="application/json,.json"/><div class="project-list"><h2>案件</h2>${state.records.length?state.records.map(r=>`<button class="${state.active?.project.id===r.record.project.id?'active':''}" data-open="${esc(r.record.project.id)}">${esc(r.record.project.name)}<span class="meta">版 ${r.record.revision} · ${r.record.updatedAt?new Date(r.record.updatedAt).toLocaleString('ja-JP'):'更新日時なし'}</span></button>`).join(''):'<p class="muted">まだ案件がありません。</p>'}</div></aside>`}
'''
          text=replace_func(text,'renderSidebar','renderOverview',sidebar)

          overview=r'''function renderOverview(p){const unresolved=(p.items||[]).filter(i=>['未解決','FAIL','要確認','保留'].includes(i.status)).length;return `<section class="panel overview-panel"><div class="overview-heading"><div><h3>判断サマリー</h3><p class="hint">案件を開いた直後に、目的・現在の焦点・未解決・次作業を確認できます。</p></div><div class="decision-state"><span class="badge">工程 ${esc(p.stage)}</span><span class="badge">未解決・要確認 ${unresolved}</span></div></div><div class="grid overview-identity"><label class="field"><span>案件名</span><input data-field="name" value="${esc(p.name)}" /></label><label class="field"><span>工程</span><select id="stageSelect">${stages.map(s=>`<option ${p.stage===s?'selected':''}>${s}</option>`).join('')}</select></label></div><div class="decision-grid"><label class="field"><span>目的</span><textarea data-field="purpose">${esc(p.purpose)}</textarea></label><label class="field"><span>現在の焦点</span><textarea data-field="focus">${esc(p.focus)}</textarea></label><label class="field"><span>次にすること</span><textarea data-field="next">${esc(p.next)}</textarea></label></div><div class="grid secondary-project-fields"><label class="field full"><span>守る方針</span><textarea data-field="rules">${esc(p.rules)}</textarea></label><label class="field full"><span>ソース基準</span><textarea data-field="baseline">${esc(p.baseline)}</textarea></label></div></section><section class="panel approval-panel"><h3>この保存版の承認</h3><p class="hint">編集すると既存承認は現在版には引き継がれません。必要な承認をこの保存操作と同時に記録します。</p><label class="checkline"><input id="approveImpl" type="checkbox" ${state.pendingApprovals.implementation?'checked':''}/> 実装承認をこの保存版に付与</label><label class="checkline"><input id="approveDone" type="checkbox" ${state.pendingApprovals.completion?'checked':''}/> 完了承認をこの保存版に付与</label><p class="muted">現在: 実装承認 ${p.implementationApproved?'済':'未'} / 完了承認 ${p.completionApproved?'済':'未'}</p></section>`}
'''
          text=replace_func(text,'renderOverview','renderItems',overview)

          items=r'''function renderItems(p){const q=String(state.itemQuery||'').trim().toLowerCase();const kind=state.itemKind||'';const status=state.itemStatus||'';const filtered=p.items.filter(i=>(!q||String(i.id).toLowerCase().includes(q)||String(i.title).toLowerCase().includes(q))&&(!kind||i.kind===kind)&&(!status||i.status===status));const pageSize=8;const pages=Math.max(1,Math.ceil(filtered.length/pageSize));state.itemPage=Math.min(Math.max(1,Number(state.itemPage)||1),pages);const start=(state.itemPage-1)*pageSize;const rows=filtered.slice(start,start+pageSize);const statuses=[...new Set(p.items.map(i=>i.status))].sort((a,b)=>String(a).localeCompare(String(b),'ja'));return `<section class="panel item-panel"><div class="items-head"><div><h3>項目</h3><p class="hint">全${p.items.length}件。検索・絞り込み・8件単位の表示で直接対象へ移動します。</p></div><button id="addItem">＋ 項目追加</button></div><div class="item-tools"><label class="field"><span>ID / タイトル検索</span><input id="itemSearch" value="${esc(state.itemQuery||'')}" placeholder="例: TASK-090" /></label><label class="field"><span>種別</span><select id="itemKindFilter"><option value="">すべて</option>${kinds.map(k=>`<option value="${esc(k)}" ${state.itemKind===k?'selected':''}>${esc(k)}</option>`).join('')}</select></label><label class="field"><span>状態</span><select id="itemStatusFilter"><option value="">すべて</option>${statuses.map(x=>`<option value="${esc(x)}" ${state.itemStatus===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label><button id="applyItemFilter" class="primary">絞り込む</button><button id="clearItemFilter">クリア</button></div><div class="item-result-head"><strong>表示 ${filtered.length?start+1:0}–${Math.min(start+pageSize,filtered.length)} / ${filtered.length}</strong><span class="muted">ページ ${state.itemPage} / ${pages}</span></div>${rows.length?rows.map(i=>`<div class="item-card item-card-compact" data-item-row="${esc(i.id)}"><div class="item-row"><div class="item-summary"><code class="item-id">${esc(i.id)}</code><h4>${esc(i.title)}</h4><div><span class="badge">${esc(i.kind)}</span> <span class="badge">${esc(i.status)}</span>${i.task?.workType?` <span class="badge">${esc(i.task.workType)}</span>`:''}</div></div><div class="inline-actions"><button data-edit="${esc(i.id)}">編集</button><button class="danger" data-delete="${esc(i.id)}">削除</button></div></div></div>`).join(''):'<p class="muted">条件に一致する項目がありません。</p>'}<div class="pager"><button id="itemPrev" ${state.itemPage<=1?'disabled':''}>前へ</button><button id="itemNext" ${state.itemPage>=pages?'disabled':''}>次へ</button></div></section>`}
'''
          text=replace_func(text,'renderItems','renderAi',items)

          item_logic=r'''function relationCandidates(currentId=''){return state.active?.project?.items?.filter(x=>x.id!==currentId)||[]}
function resolveRelationInput(value,currentId=''){const raw=String(value||'').trim();if(!raw)return {raw,id:'',item:null,valid:true};const candidates=relationCandidates(currentId);const byId=candidates.find(x=>x.id===raw);if(byId)return {raw,id:byId.id,item:byId,valid:true};const byTitle=candidates.find(x=>x.title===raw);if(byTitle)return {raw,id:byTitle.id,item:byTitle,valid:true};return {raw,id:raw,item:null,valid:false}}
function relationResolutionHtml(value,currentId=''){const r=resolveRelationInput(value,currentId);if(!r.raw)return `<div class="relation-empty muted">関連先は未設定です。</div>`;if(!r.item)return `<div class="relation-unresolved" role="alert"><strong>未解決参照</strong><span>${esc(r.raw)}</span><small>保存前に存在するIDまたはタイトルを選択してください。</small></div>`;return `<div class="relation-reference"><button type="button" class="relation-card" data-related-open="${esc(r.item.id)}"><span class="relation-kicker">関連先</span><strong>${esc(r.item.title)}</strong><code>${esc(r.item.id)}</code><span class="relation-badges"><span class="badge">${esc(r.item.kind)}</span><span class="badge">${esc(r.item.status)}</span><span class="badge">relation: parentId</span></span></button></div>`}
function relationOptionsHtml(currentId=''){return `<datalist id="itemRelationOptions">${relationCandidates(currentId).flatMap(x=>[`<option value="${esc(x.id)}" label="${esc(x.title)} · ${esc(x.kind)} · ${esc(x.status)}"></option>`,`<option value="${esc(x.title)}" label="${esc(x.id)} · ${esc(x.kind)} · ${esc(x.status)}"></option>`]).join('')}</datalist>`}
function relationBreadcrumbHtml(m){if(!m?.trail?.length)return '';return `<nav class="relation-breadcrumb" aria-label="関連ナビゲーション">${m.trail.map((id,idx)=>{const draft=m.drafts?.[id];const source=state.active?.project?.items?.find(x=>x.id===id);const item=draft||source;const label=item?.title||id;return idx===m.trail.length-1?`<span aria-current="page">${esc(label)}</span>`:`<button type="button" data-relation-jump="${esc(id)}">${esc(label)}</button>`}).join('<span class="relation-sep">›</span>')}</nav>`}
function startItemEditor(existing=null){const item=existing?clone(existing):{id:crypto.randomUUID(),kind:'作業',title:'',body:'',status:'未着手',parentId:'',reason:''};state.modal={type:'item',item,drafts:{[item.id]:item},trail:[item.id]};render()}
function stashModalDraft(m){if(!m||m.type!=='item'||!m.item)return;m.drafts=m.drafts||{};m.drafts[m.item.id]=m.item}
function openRelatedItem(id){const m=state.modal;if(!m||m.type!=='item'||!state.active)return;const target=state.active.project.items.find(x=>x.id===id);if(!target)return;stashModalDraft(m);m.drafts=m.drafts||{};m.item=m.drafts[id]||clone(target);m.drafts[id]=m.item;m.trail=[...(m.trail||[]),id];render()}
function jumpRelation(id){const m=state.modal;if(!m||m.type!=='item'||!state.active)return;const idx=(m.trail||[]).indexOf(id);if(idx<0)return;stashModalDraft(m);const target=state.active.project.items.find(x=>x.id===id);if(!target)return;m.item=m.drafts?.[id]||clone(target);m.drafts[id]=m.item;m.trail=m.trail.slice(0,idx+1);render()}
function saveItemFromModal(){const m=state.modal;if(!m||m.type!=='item'||!state.active)return;const item=m.item;if(!item.title.trim()){alert('タイトルを入力してください');return}const relation=resolveRelationInput(item.parentId,item.id);if(String(item.parentId||'').trim()&&!relation.item){alert('関連先が存在しません。候補から選択してください');return}item.parentId=relation.id;if(item.taskText!==undefined){const txt=item.taskText.trim();if(txt){try{item.task=JSON.parse(txt)}catch{alert('作業条件JSONが不正です');return}}else delete item.task;delete item.taskText}markDirty();const p=state.active.project;const idx=p.items.findIndex(x=>x.id===item.id);if(idx>=0)p.items[idx]=clone(item);else p.items.push(clone(item));state.modal=null;render()}
'''
          text=replace_func(text,'startItemEditor','deleteItem',item_logic)

          modal=r'''function renderModal(){const m=state.modal;if(!m)return '';if(m.type==='item'){const i=m.item;const taskText=i.taskText!==undefined?i.taskText:(i.task?JSON.stringify(i.task,null,2):'');i.taskText=taskText;const taskField=i.kind==='作業'?`<label class="field full"><span>作業条件JSON（任意）</span><textarea id="itemTask" class="code" placeholder='{"workType":"DEVELOPMENT_ONLY","executionOrder":0,"dependsOn":[],"acceptanceCriteria":["..."],"requiresHumanApproval":false,"references":[]}'>${esc(taskText)}</textarea></label>`:'';const relation=resolveRelationInput(i.parentId,i.id);return `<div class="modal-backdrop"><div class="modal item-editor-modal">${relationBreadcrumbHtml(m)}<h3>項目編集</h3><div class="grid"><label class="field"><span>種別</span><select id="itemKind">${kinds.map(k=>`<option ${i.kind===k?'selected':''}>${k}</option>`).join('')}</select></label><label class="field"><span>状態</span><select id="itemStatus">${statusByKind[i.kind].map(x=>`<option ${i.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field full"><span>タイトル</span><input id="itemTitle" value="${esc(i.title)}" /></label><label class="field full"><span>本文</span><textarea id="itemBody">${esc(i.body)}</textarea></label><label class="field full"><span>理由・根拠</span><textarea id="itemReason">${esc(i.reason)}</textarea></label><label class="field full relation-field"><span>関連先</span><input id="itemParent" value="${esc(i.parentId)}" placeholder="IDまたはタイトル" list="itemRelationOptions" aria-autocomplete="list" aria-invalid="${relation.valid?'false':'true'}" />${relationOptionsHtml(i.id)}</label>${relationResolutionHtml(i.parentId,i.id)}${taskField}</div><div class="modal-footer"><button id="modalCancel">閉じる</button><button class="primary" id="modalSave">編集内容へ反映</button></div></div></div>`}if(m.type==='history'){const rows=m.commits.map(c=>`<div class="history-row"><div><strong>${esc(c.commit.message.split('\n')[0])}</strong><br/><span class="muted">${new Date(c.commit.author.date).toLocaleString('ja-JP')}</span></div><button data-hist="${c.sha}"><code>${c.sha.slice(0,7)}</code></button></div>`).join('')||'<p>履歴がありません。</p>';return `<div class="modal-backdrop"><div class="modal"><h3>Git履歴</h3><p class="hint">この案件ファイルを変更した最新30コミットです。</p>${rows}<div class="modal-footer"><button id="modalCancel">閉じる</button></div></div></div>`}if(m.type==='text'){return `<div class="modal-backdrop"><div class="modal"><h3>${esc(m.title)}</h3><label class="field"><textarea class="code" readonly>${esc(m.text)}</textarea></label><div class="modal-footer"><button id="modalCancel">閉じる</button></div></div></div>`}return ''}
'''
          text=replace_func(text,'renderModal','bind',modal)

          bind=r'''function bind(){if(!state.user){$('#connectBtn')&&($('#connectBtn').onclick=connect);return}const menuBtn=$('#workspaceMenuBtn'),menuPanel=$('#workspaceMenuPanel');if(menuBtn&&menuPanel)menuBtn.onclick=()=>{const opening=menuPanel.hidden;menuPanel.hidden=!opening;menuBtn.setAttribute('aria-expanded',String(opening))};$('#newBtn')&&($('#newBtn').onclick=createDraft);$('#importBtn')&&($('#importBtn').onclick=()=>$('#importFile').click());$('#importFile')&&($('#importFile').onchange=e=>importTsuguFile(e.target.files?.[0]));$('#reloadBtn')&&($('#reloadBtn').onclick=()=>{if(isDirty()&&!confirm('未保存の変更があります。GitHubから再読込しますか？'))return;loadRecords()});$('#disconnectBtn')&&($('#disconnectBtn').onclick=disconnect);document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{if(isDirty()&&!confirm('未保存の変更があります。別案件を開きますか？'))return;const row=state.records.find(x=>x.record.project.id===b.dataset.open);if(row)openLoaded(row)});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});if(!state.active)return;$('#saveBtn').onclick=saveProject;$('#deleteBtn').onclick=deleteProject;$('#backupBtn').onclick=downloadBackup;$('#historyBtn').onclick=showHistory;document.querySelectorAll('[data-field]').forEach(el=>el.oninput=e=>updateField(el.dataset.field,e.target.value));$('#stageSelect')&&($('#stageSelect').onchange=e=>updateStage(e.target.value));$('#approveImpl')&&($('#approveImpl').onchange=e=>{state.pendingApprovals.implementation=e.target.checked;if(!e.target.checked&&state.pendingApprovals.completion)state.pendingApprovals.completion=false;render()});$('#approveDone')&&($('#approveDone').onchange=e=>{state.pendingApprovals.completion=e.target.checked;if(e.target.checked)state.pendingApprovals.implementation=true;render()});$('#addItem')&&($('#addItem').onclick=()=>startItemEditor());$('#applyItemFilter')&&($('#applyItemFilter').onclick=()=>{state.itemQuery=$('#itemSearch').value;state.itemKind=$('#itemKindFilter').value;state.itemStatus=$('#itemStatusFilter').value;state.itemPage=1;render()});$('#clearItemFilter')&&($('#clearItemFilter').onclick=()=>{state.itemQuery='';state.itemKind='';state.itemStatus='';state.itemPage=1;render()});$('#itemSearch')&&($('#itemSearch').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#applyItemFilter').click()}});$('#itemKindFilter')&&($('#itemKindFilter').onchange=e=>{state.itemKind=e.target.value;state.itemPage=1;render()});$('#itemStatusFilter')&&($('#itemStatusFilter').onchange=e=>{state.itemStatus=e.target.value;state.itemPage=1;render()});$('#itemPrev')&&($('#itemPrev').onclick=()=>{state.itemPage=Math.max(1,state.itemPage-1);render()});$('#itemNext')&&($('#itemNext').onclick=()=>{state.itemPage=state.itemPage+1;render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>startItemEditor(state.active.project.items.find(i=>i.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteItem(b.dataset.delete));$('#copyHandoff')&&($('#copyHandoff').onclick=copyHandoff);$('#applyProposal')&&($('#applyProposal').onclick=applyProposal);$('#rawApply')&&($('#rawApply').onclick=rawApply);if(state.modal){$('#modalCancel')&&($('#modalCancel').onclick=()=>{state.modal=null;render()});if(state.modal.type==='item'){const m=state.modal.item;$('#itemKind').onchange=e=>{m.kind=e.target.value;m.status=statusByKind[m.kind][0];if(m.kind!=='作業'){delete m.task;delete m.taskText}render()};$('#itemStatus').onchange=e=>m.status=e.target.value;$('#itemTitle').oninput=e=>m.title=e.target.value;$('#itemBody').oninput=e=>m.body=e.target.value;$('#itemReason').oninput=e=>m.reason=e.target.value;$('#itemParent').oninput=e=>{m.parentId=e.target.value;render()};$('#itemTask')&&($('#itemTask').oninput=e=>m.taskText=e.target.value);document.querySelectorAll('[data-related-open]').forEach(b=>b.onclick=()=>openRelatedItem(b.dataset.relatedOpen));document.querySelectorAll('[data-relation-jump]').forEach(b=>b.onclick=()=>jumpRelation(b.dataset.relationJump));$('#modalSave').onclick=saveItemFromModal}if(state.modal.type==='history')document.querySelectorAll('[data-hist]').forEach(b=>b.onclick=()=>loadHistorical(b.dataset.hist))}}
'''
          text=replace_func(text,'bind','render',bind)

          required=['workspaceMenuBtn','relationResolutionHtml','data-related-open','relation-breadcrumb','aria-autocomplete="list"']
          for marker in required:
              if marker not in text: raise SystemExit(f'missing implementation marker {marker}')

          app_path.write_text(base64.b64encode(gzip.compress(text.encode(),compresslevel=9,mtime=0)).decode()+'\n')

          css_path=Path('static/styles.css')
          css=css_path.read_text()
          marker='/* C04 v3 decision UI */'
          if marker not in css:
              css += r'''
/* C04 v3 decision UI */
.workspace-menu{margin:6px 0 10px}.workspace-menu>button{min-height:44px}.workspace-menu-panel{display:grid;gap:6px;margin-top:6px;padding:8px;border:1px solid #374151;border-radius:10px;background:#111827}.workspace-menu-panel[hidden]{display:none}.workspace-menu-panel button{min-height:44px;margin:0}.overview-heading{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.overview-heading h3{margin-bottom:6px}.decision-state{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.decision-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0}.decision-grid .field textarea{min-height:72px}.secondary-project-fields{margin-top:12px}.relation-breadcrumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 12px;font-size:12px}.relation-breadcrumb button{min-height:44px;border:1px solid #d1d5db;background:#fff;border-radius:999px;padding:7px 10px}.relation-breadcrumb span[aria-current="page"]{font-weight:700}.relation-sep{color:#9ca3af}.relation-field input[aria-invalid="true"]{border-color:#dc2626;background:#fff7f7}.relation-reference{grid-column:1/-1}.relation-card{width:100%;min-height:56px;border:1px solid #cbd5e1;background:#f8fafc;border-radius:10px;padding:10px 12px;text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:center}.relation-card .relation-kicker{font-size:11px;font-weight:700;color:#64748b}.relation-card strong{overflow-wrap:anywhere}.relation-card code{font-size:11px;color:#475569}.relation-badges{display:flex;gap:5px;flex-wrap:wrap;grid-column:1/-1}.relation-unresolved{grid-column:1/-1;border:1px solid #fecaca;background:#fef2f2;color:#991b1b;border-radius:10px;padding:10px 12px;display:grid;gap:3px}.relation-unresolved small{color:#7f1d1d}.relation-empty{grid-column:1/-1;font-size:12px}.item-card-compact .inline-actions button{min-width:44px}
@media(max-width:900px){.sidebar{padding:14px 16px}.brand{margin-bottom:12px}.sidebar .status{padding:9px 10px;margin-bottom:10px}.project-list{margin-top:10px}.project-list h2{margin:8px 0 5px}.main{padding:14px}.topbar{margin-bottom:10px}.workspace-sticky{padding:6px 0 8px;margin:0 0 10px}.panel{padding:14px;margin-bottom:10px}.overview-heading{flex-direction:column;gap:6px}.decision-state{justify-content:flex-start}.decision-grid{grid-template-columns:1fr;gap:10px;margin:10px 0}.decision-grid .field textarea{min-height:58px}.secondary-project-fields{margin-top:10px}.item-card-compact{padding:8px 10px;margin:6px 0}.item-card-compact .inline-actions button{min-height:44px;min-width:44px}.modal{padding:16px}.modal .grid{gap:12px}.modal-footer button{min-height:44px}.relation-breadcrumb{margin-bottom:8px}.relation-card{min-height:58px}}
'''
          css_path.write_text(css)

          index_path=Path('static/index.html')
          index=index_path.read_text()
          index2=re.sub(r'app\.js\?v=[^"\']+', 'app.js?v=c04-v3', index, count=1)
          if index2==index: raise SystemExit('app.js version anchor not replaced')
          index_path.write_text(index2)
          PY

          base64 --decode static/app.js.gz.b64 | gzip --decompress > /tmp/c04-v3-app.js
          node --check /tmp/c04-v3-app.js
          grep -q 'workspaceMenuBtn' /tmp/c04-v3-app.js
          grep -q 'relationResolutionHtml' /tmp/c04-v3-app.js
          grep -q 'data-related-open' /tmp/c04-v3-app.js
          grep -q 'relation-breadcrumb' /tmp/c04-v3-app.js
          grep -q 'aria-autocomplete="list"' /tmp/c04-v3-app.js
          grep -q 'C04 v3 decision UI' static/styles.css
          grep -q 'app.js?v=c04-v3' static/index.html
          git diff --check
          git config user.name 'github-actions[bot]'
