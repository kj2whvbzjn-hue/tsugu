name: TSUGU E2E

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy TSUGU']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: tsugu-e2e
  cancel-in-progress: true

jobs:
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Verify Core Guard contracts
        run: node --test tests/core-guard.test.cjs
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify TSUGU create/save/readback
        env:
          GH_TOKEN_E2E: ${{ github.token }}
          E2E_RUN_ID: ${{ github.run_id }}
          E2E_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node <<'NODE'
          (async () => {
            const { chromium } = require('playwright');
            const assert = require('node:assert/strict');
            const owner = 'kj2whvbzjn-hue';
            const repo = 'tsugu';
            const branch = `e2e-${process.env.E2E_RUN_ID}-${process.env.E2E_RUN_ATTEMPT}`;
            const token = process.env.GH_TOKEN_E2E;
            const apiHeaders = {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${token}`,
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'tsugu-e2e'
            };

            async function api(path, options = {}, allow404 = false) {
              const r = await fetch(`https://api.github.com${path}`, {
                ...options,
                headers: { ...apiHeaders, ...(options.headers || {}) }
              });
              const text = await r.text();
              if (allow404 && r.status === 404) return null;
              if (!r.ok) throw new Error(`GitHub ${r.status}: ${text}`);
              return text ? JSON.parse(text) : null;
            }
            async function projects() {
              const rows = await api(`/repos/${owner}/${repo}/contents/data/projects?ref=${encodeURIComponent(branch)}`, {}, true);
              return Array.isArray(rows) ? rows.filter(x => x.type === 'file' && x.name.endsWith('.json')) : [];
            }

            const mainRef = await api(`/repos/${owner}/${repo}/git/ref/heads/main`);
            await api(`/repos/${owner}/${repo}/git/refs`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ref: `refs/heads/${branch}`, sha: mainRef.object.sha })
            });
            console.log(`TEMP BRANCH CREATED ${branch}`);

            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            page.on('console', m => console.log(`[browser:${m.type()}] ${m.text()}`));
            page.on('dialog', async d => {
              if (d.type() === 'prompt') {
                const value = d.message().includes('案件名') ? 'Actions E2E' : 'E2E write verification';
                await d.accept(value);
              } else {
                await d.accept();
              }
            });

            await page.addInitScript(({ token, owner, repo }) => {
              const nativeFetch = window.fetch.bind(window);
              window.fetch = async (input, init = {}) => {
                const url = typeof input === 'string' ? input : input.url;
                if (url === 'https://api.github.com/user') {
                  return new Response(JSON.stringify({ login: owner, id: 1, type: 'User' }), {
                    status: 200, headers: { 'content-type': 'application/json' }
                  });
                }
                const h = new Headers(init.headers || (typeof input !== 'string' ? input.headers : undefined) || {});
                if (url.startsWith('https://api.github.com/')) h.set('Authorization', `Bearer ${token}`);
                const r = await nativeFetch(input, { ...init, headers: h });
                if (url === `https://api.github.com/repos/${owner}/${repo}` && r.ok) {
                  const data = await r.clone().json();
                  data.private = true;
                  data.permissions = { admin: true, maintain: true, push: true, pull: true };
                  return new Response(JSON.stringify(data), { status: 200, headers: { 'content-type': 'application/json' } });
                }
                return r;
              };
            }, { token, owner, repo });

            try {
              await page.goto(`https://kj2whvbzjn-hue.github.io/tsugu/?e2e=${Date.now()}`, { waitUntil: 'networkidle', timeout: 60000 });
              const inputs = page.locator('input');
              assert.ok(await inputs.count() >= 4);
              await inputs.nth(0).fill(owner);
              await inputs.nth(1).fill(repo);
              await inputs.nth(2).fill(branch);
              await inputs.nth(3).fill('github_pat_e2e_placeholder');
              await page.getByRole('button', { name: '接続', exact: true }).click();
              await page.getByText(/GitHubから\d+件を読み込みました/).waitFor({ timeout: 30000 });
              console.log('CONNECT OK');

              await page.getByRole('button', { name: /新規案件/ }).click();
              await page.getByRole('button', { name: 'GitHubへ保存' }).waitFor({ timeout: 10000 });
              assert.match(await page.locator('body').innerText(), /Actions E2E/);
              console.log('CREATE DRAFT OK');

              await page.getByRole('button', { name: 'GitHubへ保存' }).click();
              await page.getByText(/GitHubへ保存しました。案件版 1/).waitFor({ timeout: 30000 });
              console.log('UI SAVE OK');

              let created;
              for (let i = 0; i < 15 && !created; i++) {
                const after = await projects();
                created = after[0];
                if (!created) await page.waitForTimeout(1000);
              }
              assert.ok(created, 'No project JSON found after UI save');
              const file = await api(`/repos/${owner}/${repo}/contents/${created.path}?ref=${encodeURIComponent(branch)}`);
              const record = JSON.parse(Buffer.from(file.content.replace(/\n/g, ''), 'base64').toString('utf8'));
              assert.equal(record.storageVersion, 1);
              assert.equal(record.project.schemaVersion, 1);
              assert.equal(record.project.name, 'Actions E2E');
              assert.equal(record.revision, 1);
              assert.ok(record.project.id);
              assert.equal(record.project.core.securityVersion, 1);
              assert.equal(record.project.core.actors[0].login, owner);
              assert.equal(record.project.core.permissions[0].role, 'PROJECT_ADMIN');
              assert.equal(record.project.core.auditEvents.length, 1);
              assert.equal(record.project.core.auditEvents[0].actorLogin, owner);
              assert.equal(record.project.core.auditEvents[0].recordRevision, 1);
              assert.match(record.project.core.auditEvents[0].payloadHash, /^sha256:[a-f0-9]{64}$/);
              console.log(`READBACK OK ${created.path} revision=${record.revision} audit=${record.project.core.auditEvents.length}`);
              await page.screenshot({ path: 'tsugu-e2e-success.png', fullPage: true });
            } finally {
              await browser.close();
              await api(`/repos/${owner}/${repo}/git/refs/heads/${encodeURIComponent(branch)}`, { method: 'DELETE' });
              console.log(`TEMP BRANCH DELETED ${branch}`);
            }
          })().catch(e => { console.error(e.stack || e); process.exit(1); });
          NODE
      - name: Upload E2E screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsugu-e2e
          path: tsugu-e2e-success.png
          if-no-files-found: ignore
