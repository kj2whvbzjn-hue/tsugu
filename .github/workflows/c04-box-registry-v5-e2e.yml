name: TSUGU C-04 Box Registry v5 E2E
# Permanent v5 acceptance. The one-shot v4/v5 materializer workflows and patch tools are intentionally absent from the final candidate.

on:
  pull_request:
    branches: [main]
    paths:
      - 'static/app.js.gz.b64'
      - 'static/index.html'
      - 'static/structure-v4.css'
      - 'static/box-registry-v5.css'
      - 'static/box-registry-v5.js'
      - 'static/c04-box-registry-plan-v5.json'
      - 'tests/c04-box-registry-v5.e2e.cjs'
      - 'tests/longtext-fullscreen.e2e.cjs'
      - '.github/workflows/c04-box-registry-v5-e2e.yml'
  workflow_run:
    workflows: ['Deploy TSUGU']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tsugu-c04-v5-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  acceptance:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify frozen v5 plan and candidate source
        run: |
          set -euo pipefail
          node -e "const p=require('./static/c04-box-registry-plan-v5.json');if(p.planVersion!==5||p.status!=='FROZEN_BEFORE_V5_IMPLEMENTATION'||p.acceptance.length!==10)process.exit(1)"
          node --check tests/c04-box-registry-v5.e2e.cjs
          node --check tests/longtext-fullscreen.e2e.cjs
          node --check static/box-registry-v5.js
          base64 --decode static/app.js.gz.b64 | gzip --decompress > /tmp/c04-v5-app.js
          node --check /tmp/c04-v5-app.js
          node --input-type=module --check < /tmp/c04-v5-app.js
          grep -q 'C04_BOX_REGISTRY_V5_BRIDGE' /tmp/c04-v5-app.js
          grep -q 'TSUGU_APP_BRIDGE' /tmp/c04-v5-app.js
          grep -q 'TSUGU_V5_RENDER' /tmp/c04-v5-app.js
          grep -q 'box-registry-v5.css?v=c04-v5' static/index.html
          grep -q 'box-registry-v5.js?v=c04-v5' static/index.html
      - name: Build candidate Pages site
        if: ${{ github.event_name != 'workflow_run' }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -a static/. _site/
          base64 --decode static/app.js.gz.b64 | gzip --decompress > _site/app.js
          rm -f _site/app.js.gz.b64
          node --check _site/app.js
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start candidate server
        if: ${{ github.event_name != 'workflow_run' }}
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/c04-v5-http.log 2>&1 &
          echo $! > /tmp/c04-v5-server.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/c04-v5-http.log
          exit 1
      - name: Execute frozen v5 box registry acceptance
        id: v5
        continue-on-error: true
        env:
          C04_TARGET_URL: ${{ github.event_name == 'workflow_run' && 'https://kj2whvbzjn-hue.github.io/tsugu/' || 'http://127.0.0.1:4173/' }}
        run: node tests/c04-box-registry-v5.e2e.cjs
      - name: Execute Core vNext contract regressions
        id: core
        continue-on-error: true
        run: |
          node --test \
            tests/core-architecture.test.cjs \
            tests/core-box.test.cjs \
            tests/core-rule-test.test.cjs \
            tests/core-governance.test.cjs \
            tests/core-assurance-event.test.cjs
      - name: Execute long-text fullscreen regression
        id: longtext
        continue-on-error: true
        env:
          GH_TOKEN_E2E: ${{ github.token }}
          C04_TARGET_URL: ${{ github.event_name == 'workflow_run' && 'https://kj2whvbzjn-hue.github.io/tsugu/' || 'http://127.0.0.1:4173/' }}
        run: node tests/longtext-fullscreen.e2e.cjs
      - name: Finalize C-04 v5 acceptance
        if: always()
        env:
          V5_OUTCOME: ${{ steps.v5.outcome }}
          CORE_OUTCOME: ${{ steps.core.outcome }}
          LONGTEXT_OUTCOME: ${{ steps.longtext.outcome }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const read=p=>fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):null;
          const v5=read('c04-box-registry-v5-evidence.json');
          const lt=read('longtext-fullscreen-evidence.json');
          const final={type:'TSUGUC04BoxRegistryV5FinalEvidence',status:'FAIL',sourceSha:process.env.GITHUB_SHA||'',target:process.env.GITHUB_EVENT_NAME==='workflow_run'?'published':'candidate',v5:v5?.status||'MISSING',core:process.env.CORE_OUTCOME,longtext:lt?.status||process.env.LONGTEXT_OUTCOME,scenarios:v5?.scenarios||{},runtime:v5?.runtime||null,metrics:v5?.metrics||null};
          const v5ok=v5?.status==='PASS_UI5_01_TO_10_UI_RUNTIME'&&process.env.V5_OUTCOME==='success';
          const coreok=process.env.CORE_OUTCOME==='success';
          const longok=lt?.status==='PASS'&&process.env.LONGTEXT_OUTCOME==='success';
          if(v5ok&&coreok&&longok){final.status='PASS';final.scenarios['UI5-10']={status:'PASS',metrics:{uiRuntime:'PASS',coreContracts:'PASS',longtext:'PASS'}};}
          fs.writeFileSync('c04-box-registry-v5-final-evidence.json',JSON.stringify(final,null,2)+'\n');
          console.log('C04_V5_FINAL',JSON.stringify(final));
          if(final.status!=='PASS')process.exit(1);
          NODE
      - name: Upload C-04 v5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c04-box-registry-v5-evidence-${{ github.run_id }}
          path: |
            c04-box-registry-v5-evidence.json
            c04-box-registry-v5-final-evidence.json
            c04-box-registry-v5-mobile.png
            longtext-fullscreen-evidence.json
            longtext-fullscreen-mobile.png
          if-no-files-found: ignore
