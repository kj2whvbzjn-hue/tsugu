name: TSUGU C-04 Box Registry v5 Historical
# Superseded by the human-rejected v5 real-device result and v6 user-defined workspace plan.
# Frozen v5 criteria and executable test remain in static/c04-box-registry-plan-v5.json and tests/c04-box-registry-v5.e2e.cjs.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          test -f static/c04-box-registry-plan-v5.json
          test -f tests/c04-box-registry-v5.e2e.cjs
          echo 'C-04 v5 is historical and must not gate v6 or published Pages.'
