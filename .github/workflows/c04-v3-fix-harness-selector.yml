name: C04 v3 repair overview selector scope

on:
  push:
    branches:
      - c04-v3-decision-ui-implementation-20260912
    paths:
      - '.github/workflows/c04-v3-fix-harness-selector.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c04-v3-decision-ui-implementation-20260912
      - name: Scope UI3-03 labels to the overview panel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/c04-ui-usability-v3.e2e.cjs')
          s=p.read_text()
          old="const purpose=page.getByText('目的',{exact:true}).last(),focus=page.getByText('現在の焦点',{exact:true}).last(),next=page.getByText('次にすること',{exact:true}).last();"
          new="const overview=page.locator('.overview-panel');const purpose=overview.getByText('目的',{exact:true}),focus=overview.getByText('現在の焦点',{exact:true}),next=overview.getByText('次にすること',{exact:true});"
          if s.count(old)!=1: raise SystemExit(f'expected one selector anchor, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          node --check tests/c04-ui-usability-v3.e2e.cjs
          git diff --check
      - name: Commit selector repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/c04-ui-usability-v3.e2e.cjs
          git commit -m 'test: scope UI3-03 labels to overview panel'
          git push origin HEAD:c04-v3-decision-ui-implementation-20260912
