name: C04 v3 apply product patch

on:
  push:
    branches:
      - c04-v3-decision-ui-implementation-20260912
    paths:
      - .github/workflows/c04-v3-apply-product-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Stabilize source anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/c04_v3_patch.py')
          s=p.read_text()
          needle="new_editor = '''"
          editor_insert="old_editor = text[text.index(\"function startItemEditor(existing=null){\"):text.index(\"function deleteItem(id){\", text.index(\"function startItemEditor(existing=null){\"))]\n"
          if editor_insert not in s:
              if needle not in s: raise SystemExit('new_editor anchor missing')
              s=s.replace(needle,editor_insert+needle,1)
          modal_call="replace_once(modal_anchor, modal_replacement, 'modal heading')"
          modal_insert="modal_start=text.index('return `<div class=\\\"modal-backdrop\\\"><div class=\\\"modal\\\">',text.index('function renderModal(){'))\nmodal_grid=text.index('<div class=\\\"grid\\\">',modal_start)+len('<div class=\\\"grid\\\">')\nmodal_anchor=text[modal_start:modal_grid]\n"
          if modal_insert not in s:
              if modal_call not in s: raise SystemExit('modal call anchor missing')
              s=s.replace(modal_call,modal_insert+modal_call,1)
          p.write_text(s)
          PY
      - name: Apply deterministic product patch
        run: python tools/c04_v3_patch.py
      - name: Verify and commit
        run: |
          git diff --check
          git diff --stat -- static/app.js.gz.b64 static/styles.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/app.js.gz.b64 static/styles.css
          git commit -m "feat: add decision-centered related navigation UI"
          git push origin HEAD:c04-v3-decision-ui-implementation-20260912
