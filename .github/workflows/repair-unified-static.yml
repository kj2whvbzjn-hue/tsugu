name: Repair unified TSUGU artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-unified-static.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore verified artifact and apply unified wording
        shell: bash
        run: |
          set -euo pipefail
          git show b262ff0631d718f3a7ab8839d681135479659fb5:static/app.js.gz.b64 > /tmp/app.b64
          base64 --decode /tmp/app.b64 | gzip --decompress > /tmp/app.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/app.js')
          text = p.read_text()
          replacements = [
            ('GitHub Pages 静的版 — 公開UIと案件データを分離し、案件データはPrivate GitHubリポジトリに保存します。', 'TSUGU — 案件データはPrivate GitHubリポジトリに保存します。'),
            ('GitHub static workspace', 'GitHub workspace'),
            ('GitHub静的版では、AI連携は引き継ぎテキストと返却JSONで行います。', '現在のTSUGUでは、AI連携は引き継ぎテキストと返却JSONで行います。'),
            ('静的ページには固定トークンを埋め込みません。', 'TSUGUには固定トークンを埋め込みません。'),
          ]
          for old, new in replacements:
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'expected exactly one match, got {n}: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          node --check /tmp/app.js
          gzip -n -c /tmp/app.js | base64 -w 0 > static/app.js.gz.b64
          printf '\n' >> static/app.js.gz.b64
          base64 --decode static/app.js.gz.b64 | gzip --decompress > /tmp/verify.js
          cmp /tmp/app.js /tmp/verify.js
          node --check /tmp/verify.js
      - name: Commit repaired TSUGU artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js.gz.b64
          git commit -m 'Repair unified TSUGU deployment artifact'
          git push
