name: TSUGU C-04 v3 Apply Decision UI Patch

on:
  push:
    branches:
      - c04-v3-decision-ui-implementation-20260912
    paths:
      - '.github/workflows/c04-v3-apply-ui-patch.yml'
      - 'scripts/c04-v3-patch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c04-v3-decision-ui-implementation-20260912
          fetch-depth: 1
      - name: Apply patch
        run: |
          set +e
          python3 scripts/c04-v3-patch.py > /tmp/c04-patch.out 2> /tmp/c04-patch.err
          rc=$?
          set -e
          cat /tmp/c04-patch.out
          cat /tmp/c04-patch.err >&2
          if [ "$rc" -ne 0 ] && ! grep -qx 'app.js version anchor not replaced' /tmp/c04-patch.err; then
            exit "$rc"
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('static/index.html')
          s=p.read_text()
          n=re.sub(r'app\.js\?v=[^"\x27]+','app.js?v=c04-v3',s,count=1)
          if n==s and 'app.js?v=c04-v3' not in s:
              raise SystemExit('index app.js anchor missing')
          p.write_text(n)
          PY
      - name: Verify generated UI
        run: |
          set -euo pipefail
          base64 --decode static/app.js.gz.b64 | gzip --decompress > /tmp/c04-v3-app.js
          node --check /tmp/c04-v3-app.js
          grep -q 'workspaceMenuBtn' /tmp/c04-v3-app.js
          grep -q 'relationResolutionHtml' /tmp/c04-v3-app.js
          grep -q 'data-related-open' /tmp/c04-v3-app.js
          grep -q 'relation-breadcrumb' /tmp/c04-v3-app.js
          grep -q 'aria-autocomplete="list"' /tmp/c04-v3-app.js
          grep -q 'C04 v3 decision UI' static/styles.css
          grep -q 'app.js?v=c04-v3' static/index.html
          git diff --check
      - name: Commit generated UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js.gz.b64 static/styles.css static/index.html
          git commit -m 'C-04: implement v3 decision-centered relation UI'
          git push origin HEAD:c04-v3-decision-ui-implementation-20260912
