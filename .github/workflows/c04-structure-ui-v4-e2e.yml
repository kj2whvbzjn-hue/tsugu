name: TSUGU C-04 Structure UI v4 Historical
# Superseded by later C-04 plans. Frozen v4 criteria and executable test remain in the repository.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          test -f static/c04-structure-ui-plan-v4.json
          test -f tests/c04-structure-ui-v4.e2e.cjs
          echo 'C-04 v4 is historical and must not gate current published Pages.'
