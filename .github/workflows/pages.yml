name: Deploy TSUGU

on:
  push:
    branches: [main]
    paths:
      - 'static/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tsugu-deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build TSUGU artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp static/index.html static/styles.css static/favicon.svg static/core-reference.js static/core-architecture.js static/core-guard.js _site/
          base64 --decode static/app.js.gz.b64 | gzip --decompress > _site/app.js
          node --check _site/core-reference.js
          node --check _site/core-architecture.js
          node --check _site/core-guard.js
          node --check _site/app.js
      - name: Upload TSUGU artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy TSUGU
        id: deployment
        uses: actions/deploy-pages@v4
