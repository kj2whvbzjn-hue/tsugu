name: TSUGU C-04 UI Usability v2 Historical
# Superseded by later human-reviewed C-04 plans. Frozen v2 criteria and executable tests remain in the repository.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          test -f static/c04-ui-usability-plan-v2.json
          test -f tests/c04-ui-usability-v2.e2e.cjs
          echo 'C-04 v2 is historical and must not gate the current user-defined workspace.'
