name: C04 v3 UI3-03 layout fix

on:
  push:
    branches:
      - c04-v3-decision-ui-implementation-20260912
    paths:
      - '.github/workflows/c04-v3-ui303-layout-fix.yml'
      - 'tools/c04_v3_ui303_layout_patch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Apply mobile overview decision-layout fix
        run: python tools/c04_v3_ui303_layout_patch.py
      - name: Verify scoped CSS change
        run: |
          set -euo pipefail
          grep -q 'overview-grid{grid-template-columns:minmax(0,1.5fr) minmax(110px,.75fr);gap:8px}' static/styles.css
          git diff --check
      - name: Commit fixed candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/styles.css
          git commit -m "fix: compact C-04 mobile decision overview"
          git push origin HEAD:c04-v3-decision-ui-implementation-20260912
