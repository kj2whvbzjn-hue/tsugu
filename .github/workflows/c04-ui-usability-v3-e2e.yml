name: TSUGU C-04 UI Usability v3 Historical
# v3 was rejected by human real-device review and is superseded. Frozen criteria and executable tests remain in the repository.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          test -f static/c04-ui-usability-plan-v3.json
          test -f tests/c04-ui-usability-v3.e2e.cjs
          echo 'C-04 v3 is historical and must not gate the current user-defined workspace.'
