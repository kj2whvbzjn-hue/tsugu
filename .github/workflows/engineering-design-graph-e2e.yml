name: Engineering Design Graph E2E
on:
  pull_request:
    branches: [main]
    paths:
      - 'engineering-design-graph/**'
      - 'tests/engineering-design-graph*.mjs'
      - 'tests/engineering-design-graph*.cjs'
      - 'tests/engineering-design-api.test.mjs'
      - 'package.json'
      - '.github/workflows/engineering-design-graph-e2e.yml'
  push:
    branches:
      - 'feature/engineering-design-graph-mvp'
    paths:
      - 'engineering-design-graph/**'
      - 'tests/engineering-design-graph*.mjs'
      - 'tests/engineering-design-graph*.cjs'
      - 'tests/engineering-design-api.test.mjs'
      - 'package.json'
      - '.github/workflows/engineering-design-graph-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Engineering Design Graph domain and API tests
        run: npm test
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve isolated Engineering Design Graph app
        run: |
          python3 -m http.server 4174 --directory . > /tmp/engineering-design-graph-server.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4174/engineering-design-graph/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/engineering-design-graph-server.log
          exit 1
      - name: Run Playwright E2E on desktop and mobile
        run: npm run test:engineering-design:e2e
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-design-graph-e2e-${{ github.sha }}
          path: |
            outputs/engineering-design-graph/
            /tmp/engineering-design-graph-server.log
          if-no-files-found: warn
