name: C04 v3 repair duplicate helper

on:
  push:
    branches:
      - c04-v3-decision-ui-implementation-20260912
    paths:
      - 'scripts/c04-v3-repair-duplicate.py'
      - '.github/workflows/c04-v3-repair-duplicate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c04-v3-decision-ui-implementation-20260912
      - name: Remove legacy duplicate helper block
        run: python3 scripts/c04-v3-repair-duplicate.py
      - name: Verify as ES module
        run: |
          base64 --decode static/app.js.gz.b64 | gzip --decompress > /tmp/c04-v3-app.js
          node --input-type=module --check < /tmp/c04-v3-app.js
          test "$(grep -o 'function relationResolutionHtml(' /tmp/c04-v3-app.js | wc -l)" -eq 1
          git diff --check
      - name: Commit repaired bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js.gz.b64
          git commit -m 'C-04: remove duplicate relation helper'
          git push origin HEAD:c04-v3-decision-ui-implementation-20260912
