name: TSUGU C-04 UI Usability v1 Historical

# Historical v1 acceptance is intentionally preserved as FAIL evidence.
# Current UI acceptance is TSUGU C-04 UI Usability v2 E2E.
# Do not run v1 automatically against newer product sources because its
# candidate patch assumptions belong to the pre-v2 implementation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify preserved v1 evidence inputs
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./static/c04-ui-usability-plan.json');if(p.status!=='FROZEN_BEFORE_EXECUTION'||p.version!==1)process.exit(1)"
          test "$(cat tests/c04-ui-usability.e2e.cjs.gz.b64.part00 tests/c04-ui-usability.e2e.cjs.gz.b64.part01 tests/c04-ui-usability.e2e.cjs.gz.b64.part02 tests/c04-ui-usability.e2e.cjs.gz.b64.part03 tests/c04-ui-usability.e2e.cjs.gz.b64.part04 | base64 --decode | gzip --decompress | sha256sum | awk '{print $1}')" = "c3f1ab5d3872fafa2dfa946da3b1390e1d6ca75e410a5effce3138a1d7f9a9fb"
          echo 'Historical FAIL run: 34657670861'
          echo 'Historical source SHA: 3050f205e2408b0c02592cf6e1a1db44cc56d452'
          echo 'Current acceptance workflow: .github/workflows/c04-ui-usability-v2-e2e.yml'
