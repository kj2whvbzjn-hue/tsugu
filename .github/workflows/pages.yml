name: Deploy TSUGU

on:
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'docs/TSUGU_CORE_VNEXT_C03_LOAD_PROFILE.json'
      - '.github/scripts/build-pages-site.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tsugu-deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build TSUGU artifact
        shell: bash
        run: bash .github/scripts/build-pages-site.sh _site
      - name: Upload TSUGU artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy TSUGU
        id: deployment
        uses: actions/deploy-pages@v4
