name: TSUGU C-04 User-defined Workspace v6 E2E
# Current C-04 acceptance. Earlier v2-v5 acceptance workflows are historical/manual only.

on:
  pull_request:
    branches: [main]
    paths:
      - 'static/app.js.gz.b64'
      - 'static/index.html'
      - 'static/user-workspace-v6.css'
      - 'static/user-workspace-v6.js'
      - 'static/c04-user-defined-workspace-plan-v6.json'
      - 'tests/c04-user-defined-workspace-v6.e2e.cjs'
      - 'tests/longtext-fullscreen.e2e.cjs'
      - '.github/scripts/build-pages-site.sh'
      - '.github/workflows/pages.yml'
      - '.github/workflows/c04-ui-usability-v2-e2e.yml'
      - '.github/workflows/c04-ui-usability-v3-e2e.yml'
      - '.github/workflows/c04-structure-ui-v4-e2e.yml'
      - '.github/workflows/c04-box-registry-v5-e2e.yml'
      - '.github/workflows/c04-user-defined-workspace-v6-e2e.yml'
  workflow_run:
    workflows: ['Deploy TSUGU']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tsugu-c04-v6-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  acceptance:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify frozen v6 plan and source policy
        run: |
          set -euo pipefail
          node -e "const p=require('./static/c04-user-defined-workspace-plan-v6.json');if(p.planVersion!==6||p.status!=='FROZEN_BEFORE_V6_IMPLEMENTATION'||p.acceptance.length!==10)process.exit(1)"
          node --check tests/c04-user-defined-workspace-v6.e2e.cjs
          node --check tests/longtext-fullscreen.e2e.cjs
          node --check static/user-workspace-v6.js
          bash -n .github/scripts/build-pages-site.sh
          grep -q 'user-workspace-v6.css?v=c04-v6' static/index.html
          grep -q 'user-workspace-v6.js?v=c04-v6' static/index.html
          ! grep -q 'box-registry-v5.js' static/index.html
          ! grep -q 'box-registry-v5.css' static/index.html
          ! grep -q 'BUILTIN_TYPES' static/user-workspace-v6.js
          ! grep -q "\['uses','schema','ui','test','data','sequence'\]" static/user-workspace-v6.js
          ! grep -q 'name="boxType"' static/user-workspace-v6.js
          ! grep -q 'name="kind"' static/user-workspace-v6.js
      - name: Build exact Pages candidate
        if: ${{ github.event_name != 'workflow_run' }}
        run: bash .github/scripts/build-pages-site.sh _site
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start candidate server
        if: ${{ github.event_name != 'workflow_run' }}
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/c04-v6-http.log 2>&1 &
          echo $! > /tmp/c04-v6-server.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/c04-v6-http.log
          exit 1
      - name: Execute frozen v6 acceptance
        id: v6
        continue-on-error: true
        env:
          C04_TARGET_URL: ${{ github.event_name == 'workflow_run' && 'https://kj2whvbzjn-hue.github.io/tsugu/' || 'http://127.0.0.1:4173/' }}
        run: node tests/c04-user-defined-workspace-v6.e2e.cjs
      - name: Execute Core vNext contract regressions
        id: core
        continue-on-error: true
        run: |
          node --test \
            tests/core-architecture.test.cjs \
            tests/core-box.test.cjs \
            tests/core-rule-test.test.cjs \
            tests/core-governance.test.cjs \
            tests/core-assurance-event.test.cjs
      - name: Execute long-text fullscreen regression
        id: longtext
        continue-on-error: true
        env:
          GH_TOKEN_E2E: ${{ github.token }}
          C04_TARGET_URL: ${{ github.event_name == 'workflow_run' && 'https://kj2whvbzjn-hue.github.io/tsugu/' || 'http://127.0.0.1:4173/' }}
        run: node tests/longtext-fullscreen.e2e.cjs
      - name: Finalize C-04 v6 acceptance
        if: always()
        env:
          V6_OUTCOME: ${{ steps.v6.outcome }}
          CORE_OUTCOME: ${{ steps.core.outcome }}
          LONGTEXT_OUTCOME: ${{ steps.longtext.outcome }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const read=p=>fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):null;
          const v6=read('c04-user-defined-workspace-v6-evidence.json');
          const lt=read('longtext-fullscreen-evidence.json');
          const final={type:'TSUGUC04UserDefinedWorkspaceV6FinalEvidence',status:'FAIL',sourceSha:process.env.GITHUB_SHA||'',target:process.env.GITHUB_EVENT_NAME==='workflow_run'?'published':'candidate',v6:v6?.status||'MISSING',core:process.env.CORE_OUTCOME,longtext:lt?.status||process.env.LONGTEXT_OUTCOME,scenarios:v6?.scenarios||{},runtime:v6?.runtime||null,metrics:v6?.metrics||null};
          const v6ok=v6?.status==='PASS_UI6_01_TO_10_UI_RUNTIME'&&process.env.V6_OUTCOME==='success';
          const coreok=process.env.CORE_OUTCOME==='success';
          const longok=lt?.status==='PASS'&&process.env.LONGTEXT_OUTCOME==='success';
          if(v6ok&&coreok&&longok)final.status='PASS';
          fs.writeFileSync('c04-user-defined-workspace-v6-final-evidence.json',JSON.stringify(final,null,2)+'\n');
          console.log('C04_V6_FINAL',JSON.stringify(final));
          if(final.status!=='PASS')process.exit(1);
          NODE
      - name: Upload C-04 v6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c04-user-defined-workspace-v6-evidence-${{ github.run_id }}
          path: |
            c04-user-defined-workspace-v6-evidence.json
            c04-user-defined-workspace-v6-final-evidence.json
            c04-user-defined-workspace-v6-mobile.png
            longtext-fullscreen-evidence.json
            longtext-fullscreen-mobile.png
          if-no-files-found: ignore
