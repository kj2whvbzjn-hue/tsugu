name: TSUGU C-04 v2 Harness Final 404 Patch

on:
  push:
    branches: [vnext-c04-ui-usability-20260912]
    paths:
      - '.github/workflows/c04-v2-harness-final404-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: vnext-c04-ui-usability-20260912
      - name: Mark final empty-directory 404 as expected
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/c04-ui-usability-v2.e2e.cjs')
          s=p.read_text()
          old="expectedMutation404=true;await click(page.getByRole('button',{name:'削除',exact:true}),'delete-plan');"
          new="expectedMutation404=true;expectedWorkspace404=true;await click(page.getByRole('button',{name:'削除',exact:true}),'delete-plan');"
          if old not in s:
              raise SystemExit('final delete harness anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check tests/c04-ui-usability-v2.e2e.cjs
          git config user.name 'TSUGU C-04 E2E'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/c04-ui-usability-v2.e2e.cjs
          git commit -m 'C-04: classify final empty workspace 404 as expected'
          git push origin HEAD:vnext-c04-ui-usability-20260912
