name: B-06 Materialize

on:
  push:
    branches: [vnext-b06-20260911]
    paths:
      - '.b06bundle/**'
      - '.github/workflows/b06-materialize.yml'

permissions:
  contents: write

concurrency:
  group: b06-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: vnext-b06-20260911
      - name: Materialize and verify B-06 sources against real B-03/B-04 cores
        shell: bash
        run: |
          set -euo pipefail
          cat .b06bundle/payload.part*.b64 | base64 --decode > /tmp/b06-payload.tar.gz
          tar -xzf /tmp/b06-payload.tar.gz
          node --check static/core-assurance-event.js
          node --check static/core-task-execution.js
          node --check static/core-assurance-event-changeset.js
          node --test tests/core-assurance-event.test.cjs
      - name: Commit materialized B-06 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/core-assurance-event.js static/core-task-execution.js static/core-assurance-event-changeset.js tests/core-assurance-event.test.cjs docs/TSUGU_CORE_VNEXT_B06.md change-records/B-06.json static/index.html
          git rm -r .b06bundle
          git commit -m 'Implement B-06 Assurance Event task dependencies'
          git push origin HEAD:vnext-b06-20260911
