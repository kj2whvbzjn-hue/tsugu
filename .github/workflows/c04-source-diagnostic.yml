name: TSUGU C-04 Source Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/c04-source-diagnostic.yml'
      - 'static/app.js.gz.b64'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Decode app and print C-04 repair anchors
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode static/app.js.gz.b64 | gzip --decompress > /tmp/app.js
          node --check /tmp/app.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/app.js').read_text()
          for needle in ['async function gh','function gh','function renderItems','function renderMain','function render()']:
              print(f'===== {needle} =====')
              i=s.find(needle)
              if i < 0:
                  print('NOT FOUND')
              else:
                  print(s[max(0,i-1800):min(len(s),i+7000)])
          PY
