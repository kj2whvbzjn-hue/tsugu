name: TSUGU Rule Test E2E

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy TSUGU']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: tsugu-rule-test-e2e
  cancel-in-progress: true

jobs:
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Verify B-02 contracts
        run: node --test tests/core-rule-test.test.cjs
      - name: Verify published modules and GitHub Rule/Test ChangeSet flow
        env:
          GH_TOKEN_E2E: ${{ github.token }}
          E2E_RUN_ID: ${{ github.run_id }}
          E2E_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          curl -fsSL "https://kj2whvbzjn-hue.github.io/tsugu/core-rule-test.js?run=${E2E_RUN_ID}" -o /tmp/published-core-rule-test.js
          curl -fsSL "https://kj2whvbzjn-hue.github.io/tsugu/core-rule-test-changeset.js?run=${E2E_RUN_ID}" -o /tmp/published-core-rule-test-changeset.js
          cmp static/core-rule-test.js /tmp/published-core-rule-test.js
          cmp static/core-rule-test-changeset.js /tmp/published-core-rule-test-changeset.js
          node <<'NODE'
          (async () => {
            const assert = require('node:assert/strict');
            const fs = require('node:fs');
            const Architecture = require('./static/core-architecture.js');
            const Box = require('./static/core-box.js');
            const RuleTest = require('./static/core-rule-test.js');
            const RuleTestChangeSet = require('./static/core-rule-test-changeset.js');
            const owner = 'kj2whvbzjn-hue';
            const repo = 'tsugu';
            const repositoryId = 1363396531;
            const branch = `b02-e2e-${process.env.E2E_RUN_ID}-${process.env.E2E_RUN_ATTEMPT}`;
            const path = `data/e2e/b02-${process.env.E2E_RUN_ID}-${process.env.E2E_RUN_ATTEMPT}.json`;
            const token = process.env.GH_TOKEN_E2E;
            const sourceSha = process.env.SOURCE_SHA;
            const headers = {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${token}`,
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'tsugu-b02-e2e'
            };
            async function api(pathname, options = {}, allow404 = false) {
              const r = await fetch(`https://api.github.com${pathname}`, { ...options, headers: { ...headers, ...(options.headers || {}) } });
              const text = await r.text();
              if (allow404 && r.status === 404) return null;
              if (!r.ok) throw new Error(`GitHub ${r.status}: ${text}`);
              return text ? JSON.parse(text) : null;
            }
            async function readAggregate(ref = branch) {
              const file = await api(`/repos/${owner}/${repo}/contents/${path}?ref=${encodeURIComponent(ref)}`);
              const json = Buffer.from(file.content.replace(/\n/g, ''), 'base64').toString('utf8');
              return { file, aggregate: RuleTestChangeSet.validateAggregate(JSON.parse(json)) };
            }
            async function waitForBranchBlob(expectedSha) {
              for (let i = 0; i < 12; i++) {
                const file = await api(`/repos/${owner}/${repo}/contents/${path}?ref=${encodeURIComponent(branch)}`);
                if (file.sha === expectedSha) return file;
                await new Promise(r => setTimeout(r, 250));
              }
              throw new Error(`branch content did not reach expected blob ${expectedSha}`);
            }

            await api(`/repos/${owner}/${repo}/git/refs`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ref: `refs/heads/${branch}`, sha: sourceSha })
            });
            console.log(`TEMP BRANCH CREATED ${branch}`);
            try {
              let architecture = Architecture.createProjectArchitecture({
                projectId: 'project:b02:e2e', name: 'B-02 E2E',
                repositoryScopes: [{ repositoryId, fullName: `${owner}/${repo}` }]
              });
              architecture = Architecture.addArchitectureNode(architecture, { id: 'node:root', name: 'Root' });
              architecture = Architecture.addArchitectureNode(architecture, { id: 'node:child', name: 'Child', parentNodeId: 'node:root' });
              let boxRegistry = Box.seedSystemDefinitions(Box.migrateFromStageA(architecture));
              boxRegistry = Box.createBoxInstance(boxRegistry, { id: 'box-instance:root', boxDefinitionId: 'system:box:component', boxDefinitionVersion: 1, architectureNodeId: 'node:root', config: { name: 'root' } });
              boxRegistry = Box.createBoxInstance(boxRegistry, { id: 'box-instance:child', boxDefinitionId: 'system:box:leaf', boxDefinitionVersion: 1, architectureNodeId: 'node:child', parentBoxInstanceId: 'box-instance:root', config: { name: 'child' } });
              const registry = RuleTest.migrateFromB01(boxRegistry);
              const initial = RuleTestChangeSet.createAggregate(registry);
              const created = await api(`/repos/${owner}/${repo}/contents/${path}`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: 'Initialize B-02 E2E aggregate', content: Buffer.from(RuleTestChangeSet.stableStringify(initial)).toString('base64'), branch })
              });

              const first = RuleTestChangeSet.createChangeSet({
                id: 'rule-test-changeset:b02:derive', projectId: initial.projectId, idempotencyKey: 'idem:b02:derive',
                baseRevision: initial.revision, baseBlobSha: created.content.sha, createdBy: owner,
                operations: [
                  { type: 'CREATE_RULE_DRAFT', id: 'rule:coverage:parent', version: 1, name: 'Parent coverage', constraints: [{ type: 'MIN', key: 'coverage', value: 70 }] },
                  { type: 'PUBLISH_RULE', ruleDefinitionId: 'rule:coverage:parent', ruleDefinitionVersion: 1, at: '2026-09-11T04:30:00Z' },
                  { type: 'ADD_RULE_BINDING', id: 'rule-binding:parent', ruleDefinitionId: 'rule:coverage:parent', ruleDefinitionVersion: 1, targetType: 'BOX_INSTANCE', boxInstanceId: 'box-instance:root', inheritToChildren: true },
                  { type: 'CREATE_RULE_DRAFT', id: 'rule:coverage:child', version: 1, name: 'Child coverage', constraints: [{ type: 'MIN', key: 'coverage', value: 80 }] },
                  { type: 'PUBLISH_RULE', ruleDefinitionId: 'rule:coverage:child', ruleDefinitionVersion: 1, at: '2026-09-11T04:31:00Z' },
                  { type: 'ADD_RULE_BINDING', id: 'rule-binding:child', ruleDefinitionId: 'rule:coverage:child', ruleDefinitionVersion: 1, targetType: 'BOX_INSTANCE', boxInstanceId: 'box-instance:child', inheritToChildren: true },
                  { type: 'CREATE_TEST_DRAFT', id: 'test:smoke', version: 1, name: 'Smoke', runner: 'SHELL', command: 'node --test', evaluationConditions: { exitCode: 0 } },
                  { type: 'PUBLISH_TEST', testDefinitionId: 'test:smoke', testDefinitionVersion: 1, at: '2026-09-11T04:32:00Z' },
                  { type: 'ADD_REQUIREMENT_SOURCE', id: 'requirement-source:leaf', sourceBoxDefinitionId: 'system:box:leaf', sourceBoxDefinitionVersion: 1, testDefinitionId: 'test:smoke', testDefinitionVersion: 1, scope: 'SELF' },
                  { type: 'RECOMPUTE_REQUIREMENTS' }
                ]
              });
              const v1 = RuleTestChangeSet.validateChangeSet(initial, created.content.sha, first, { now: '2026-09-11T04:33:00Z' });
              const applied1 = await RuleTestChangeSet.applyWithContentApi({ fetch, owner, repo, branch, path, token, changeSet: first, validationRecord: v1.validationRecord, actor: owner, now: '2026-09-11T04:34:00Z' });
              assert.equal(applied1.status, 'APPLIED');
              let current = await readAggregate(applied1.commitSha);
              await waitForBranchBlob(current.file.sha);
              let requirement = current.aggregate.registry.testRequirements.find(x => x.status === 'ACTIVE' && x.target.boxInstanceId === 'box-instance:child');
              assert.ok(requirement);
              assert.equal(requirement.effectiveRules.status, 'VALID');
              assert.equal(requirement.effectiveRules.constraints.find(x => x.type === 'MIN' && x.key === 'coverage').value, 80);
              assert.equal(requirement.effectiveRules.sources.length, 2);
              assert.deepEqual(requirement.effectiveRules.sources.find(x => x.bindingId === 'rule-binding:parent').inheritancePath, ['box-instance:root', 'box-instance:child']);
              const requirementVersionBefore = requirement.version;

              const second = RuleTestChangeSet.createChangeSet({
                id: 'rule-test-changeset:b02:snapshot', projectId: current.aggregate.projectId, idempotencyKey: 'idem:b02:snapshot',
                baseRevision: current.aggregate.revision, baseBlobSha: current.file.sha, createdBy: owner,
                operations: [
                  { type: 'SET_MANUAL_REQUIREMENT_EDIT', requirementId: requirement.id, note: 'human-owned note', priority: 'HIGH', labels: ['manual'], at: '2026-09-11T04:35:00Z' },
                  { type: 'RECOMPUTE_REQUIREMENTS' },
                  { type: 'CREATE_REQUIREMENT_SNAPSHOT_DRAFT', id: 'requirement-snapshot:final', targetBoxInstanceId: 'box-instance:child', at: '2026-09-11T04:36:00Z' },
                  { type: 'FINALIZE_REQUIREMENT_SNAPSHOT', snapshotId: 'requirement-snapshot:final', at: '2026-09-11T04:37:00Z' }
                ]
              });
              const v2 = RuleTestChangeSet.validateChangeSet(current.aggregate, current.file.sha, second, { now: '2026-09-11T04:37:10Z' });
              const applied2 = await RuleTestChangeSet.applyWithContentApi({ fetch, owner, repo, branch, path, token, changeSet: second, validationRecord: v2.validationRecord, actor: owner, now: '2026-09-11T04:38:00Z' });
              assert.equal(applied2.status, 'APPLIED');
              current = await readAggregate(applied2.commitSha);
              await waitForBranchBlob(current.file.sha);
              requirement = current.aggregate.registry.testRequirements.find(x => x.id === requirement.id);
              assert.equal(requirement.version, requirementVersionBefore);
              const manual = current.aggregate.registry.manualRequirementEdits.find(x => x.requirementId === requirement.id);
              assert.equal(manual.note, 'human-owned note');
              const finalSnapshot = current.aggregate.registry.requirementSnapshots.find(x => x.id === 'requirement-snapshot:final');
              assert.equal(finalSnapshot.status, 'FINAL');
              assert.match(finalSnapshot.contentHash, /^sha256:[a-f0-9]{64}$/);
              assert.equal(finalSnapshot.requirementItems[0].source.sourceBoxDefinitionVersion, 1);
              assert.equal(finalSnapshot.requirementItems[0].testDefinition.version, 1);
              assert.equal(finalSnapshot.requirementItems[0].evaluationConditions.exitCode, 0);

              const weaker = RuleTestChangeSet.createChangeSet({
                id: 'rule-test-changeset:b02:weaker', projectId: current.aggregate.projectId, idempotencyKey: 'idem:b02:weaker',
                baseRevision: current.aggregate.revision, baseBlobSha: current.file.sha, createdBy: owner,
                operations: [
                  { type: 'CREATE_NEXT_RULE_VERSION', ruleDefinitionId: 'rule:coverage:parent', fromVersion: 1, constraints: [{ type: 'MIN', key: 'coverage', value: 60 }] },
                  { type: 'PUBLISH_RULE', ruleDefinitionId: 'rule:coverage:parent', ruleDefinitionVersion: 2, at: '2026-09-11T04:39:00Z' }
                ]
              });
              assert.throws(() => RuleTestChangeSet.validateChangeSet(current.aggregate, current.file.sha, weaker, { now: '2026-09-11T04:39:10Z' }), e => e.code === 'RULE_WEAKENING_REQUIRES_WAIVER');
              assert.throws(() => RuleTest.assertWaiverUnavailable(), e => e.code === 'WAIVER_NOT_AVAILABLE_UNTIL_B03');

              const conflictDraft = RuleTestChangeSet.createChangeSet({
                id: 'rule-test-changeset:b02:conflict-draft', projectId: current.aggregate.projectId, idempotencyKey: 'idem:b02:conflict-draft',
                baseRevision: current.aggregate.revision, baseBlobSha: current.file.sha, createdBy: owner,
                operations: [
                  { type: 'CREATE_RULE_DRAFT', id: 'rule:opaque', version: 1, name: 'Opaque policy', constraints: [{ type: 'OPAQUE', key: 'coverage', text: 'coverage must be sufficiently high' }] },
                  { type: 'PUBLISH_RULE', ruleDefinitionId: 'rule:opaque', ruleDefinitionVersion: 1, at: '2026-09-11T04:40:00Z' },
                  { type: 'ADD_RULE_BINDING', id: 'rule-binding:opaque', ruleDefinitionId: 'rule:opaque', ruleDefinitionVersion: 1, targetType: 'BOX_INSTANCE', boxInstanceId: 'box-instance:child' },
                  { type: 'RECOMPUTE_REQUIREMENTS' },
                  { type: 'CREATE_REQUIREMENT_SNAPSHOT_DRAFT', id: 'requirement-snapshot:conflict', targetBoxInstanceId: 'box-instance:child', at: '2026-09-11T04:41:00Z' }
                ]
              });
              const v3 = RuleTestChangeSet.validateChangeSet(current.aggregate, current.file.sha, conflictDraft, { now: '2026-09-11T04:41:10Z' });
              const applied3 = await RuleTestChangeSet.applyWithContentApi({ fetch, owner, repo, branch, path, token, changeSet: conflictDraft, validationRecord: v3.validationRecord, actor: owner, now: '2026-09-11T04:42:00Z' });
              current = await readAggregate(applied3.commitSha);
              await waitForBranchBlob(current.file.sha);
              const conflictSnapshot = current.aggregate.registry.requirementSnapshots.find(x => x.id === 'requirement-snapshot:conflict');
              assert.equal(conflictSnapshot.status, 'DRAFT');
              const conflictReq = current.aggregate.registry.testRequirements.find(x => x.status === 'ACTIVE' && x.target.boxInstanceId === 'box-instance:child');
              assert.equal(conflictReq.effectiveRules.status, 'CONFLICT');
              assert.equal(current.aggregate.registry.manualRequirementEdits.find(x => x.requirementId === conflictReq.id).note, 'human-owned note');

              const beforeGateSha = current.file.sha;
              const gate = RuleTestChangeSet.createChangeSet({
                id: 'rule-test-changeset:b02:conflict-final', projectId: current.aggregate.projectId, idempotencyKey: 'idem:b02:conflict-final',
                baseRevision: current.aggregate.revision, baseBlobSha: current.file.sha, createdBy: owner,
                operations: [{ type: 'FINALIZE_REQUIREMENT_SNAPSHOT', snapshotId: 'requirement-snapshot:conflict', at: '2026-09-11T04:43:00Z' }]
              });
              assert.throws(() => RuleTestChangeSet.validateChangeSet(current.aggregate, current.file.sha, gate, { now: '2026-09-11T04:43:10Z' }), e => e.code === 'SNAPSHOT_GATE_CONFLICT');
              const afterGate = await readAggregate(branch);
              assert.equal(afterGate.file.sha, beforeGateSha);

              const observation = {
                sourceSha,
                appliedDeriveCommitSha: applied1.commitSha,
                appliedSnapshotCommitSha: applied2.commitSha,
                appliedConflictDraftCommitSha: applied3.commitSha,
                finalRevision: current.aggregate.revision,
                migrationVersion: current.aggregate.registry.migrationVersion,
                effectiveCoverageMin: 80,
                parentOriginVisible: true,
                childOriginVisible: true,
                parentInheritancePath: ['box-instance:root', 'box-instance:child'],
                requirementDerivationIdempotent: requirementVersionBefore === requirement.version,
                manualEditPreserved: true,
                finalSnapshotHash: finalSnapshot.contentHash,
                sourceBoxVersionFixed: finalSnapshot.requirementItems[0].source.sourceBoxDefinitionVersion,
                testDefinitionVersionFixed: finalSnapshot.requirementItems[0].testDefinition.version,
                supersedeWeakeningRejected: true,
                waiverUnavailableUntilB03: true,
                conflictDraftSaved: true,
                conflictFinalGateRejected: true,
                gateFailureNoWrite: true
              };
              fs.writeFileSync('b02-observation.json', JSON.stringify(observation, null, 2));
              console.log(JSON.stringify(observation));
            } finally {
              await api(`/repos/${owner}/${repo}/git/refs/heads/${encodeURIComponent(branch)}`, { method: 'DELETE' });
              console.log(`TEMP BRANCH DELETED ${branch}`);
            }
          })().catch(e => { console.error(e.stack || e); process.exit(1); });
          NODE
      - name: Upload B-02 observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsugu-b02-observation
          path: b02-observation.json
          if-no-files-found: ignore
